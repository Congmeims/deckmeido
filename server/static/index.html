<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#0f1117">
<link rel="icon" href="/logo.jpg">
<title>DeckMate</title>
<style>
  :root {
    --bg: #0f1117;
    --surface: #1a1d27;
    --surface-2: #232737;
    --text: #e8eaf0;
    --muted: #8b91a3;
    --brand: #1a9fff;
    --user-bubble: #1a9fff;
    --danger: #e8463a;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  html, body { height: 100%; }
  body {
    background: var(--bg);
    color: var(--text);
    font-family: "PingFang SC", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    font-size: 16px;
    display: flex;
    flex-direction: column;
    height: 100dvh;
    overflow: hidden;
  }

  /* 顶部状态栏 */
  header {
    flex: 0 0 auto;
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 10px 14px;
    padding-top: calc(10px + env(safe-area-inset-top));
    background: var(--surface);
    border-bottom: 1px solid rgba(255,255,255,.06);
  }
  .logo { font-weight: 600; font-size: 17px; }
  .dot { width: 9px; height: 9px; border-radius: 50%; background: var(--danger); flex: 0 0 auto; }
  .dot.on { background: #2ecc71; }
  .status-text { color: var(--muted); font-size: 12px; }
  .spacer { flex: 1; }
  .badge {
    font-size: 12px; color: var(--muted);
    background: var(--surface-2);
    padding: 4px 10px; border-radius: 999px;
    white-space: nowrap;
  }

  /* 横向菜单栏 */
  #menuBar {
    flex: 0 0 auto;
    display: flex; gap: 8px; align-items: center;
    padding: 8px 12px;
    background: var(--surface);
    border-bottom: 1px solid rgba(255,255,255,.06);
    overflow-x: auto;
  }
  .menu-btn {
    flex: 0 0 auto;
    border: 1px solid rgba(255,255,255,.1);
    background: var(--surface-2); color: var(--text);
    font-size: 13px; padding: 6px 12px; border-radius: 999px;
    cursor: pointer; white-space: nowrap;
  }
  .menu-btn:active { opacity: .7; }

  /* 消息区 */
  #messages {
    flex: 1 1 auto;
    overflow-y: auto;
    padding: 14px;
    display: flex;
    flex-direction: column;
    gap: 10px;
    -webkit-overflow-scrolling: touch;
  }
  .msg {
    max-width: 85%;
    padding: 10px 14px;
    border-radius: 16px;
    line-height: 1.55;
    font-size: 15.5px;
    white-space: pre-wrap;
    word-break: break-word;
  }
  .msg.user {
    align-self: flex-end;
    background: var(--user-bubble);
    color: #fff;
    border-bottom-right-radius: 4px;
  }
  .msg.assistant {
    align-self: flex-start;
    background: var(--surface-2);
    border-bottom-left-radius: 4px;
  }
  .msg.system {
    align-self: center;
    background: transparent;
    color: var(--muted);
    font-size: 13px;
    padding: 2px 8px;
  }
  .msg .time { display: block; margin-top: 4px; font-size: 11px; opacity: .55; }

  /* markdown 内容 */
  .msg pre { background: #0b0d13; padding: 10px 12px; border-radius: 8px; overflow-x: auto; margin: 6px 0; font-size: 13px; }
  .msg code { background: #0b0d13; padding: 2px 6px; border-radius: 5px; font-size: 13px; font-family: ui-monospace, monospace; }
  .msg pre code { background: none; padding: 0; }
  .msg h3, .msg h4 { margin: 8px 0 4px; color: var(--brand); }
  .msg ul { padding-left: 20px; margin: 4px 0; }
  .msg a { color: var(--brand); }

  /* 事件区：思维链 / 工具调用 / 文件改动 */
  .events { align-self: flex-start; max-width: 90%; display: flex; flex-direction: column; gap: 6px; }
  .ev { font-size: 13px; border-radius: 10px; padding: 7px 12px; }
  .ev.thought { background: rgba(138,147,163,.1); color: var(--muted); }
  .ev.thought summary { cursor: pointer; user-select: none; }
  .ev.thought .thought-body { margin-top: 6px; white-space: pre-wrap; line-height: 1.5; font-size: 12.5px; opacity: .85; }
  .ev.tool { background: rgba(26,159,255,.12); color: #9fd4ff; font-family: ui-monospace, monospace; font-size: 12.5px; word-break: break-all; }
  .ev.tool .ev-name { font-weight: 700; color: var(--brand); margin-right: 6px; }
  .ev.tool.approved { background: rgba(232,179,57,.12); color: #e8b339; }
  .ev.tool .term {
    display: block; margin-top: 6px;
    background: #0b0d13; color: #c8d3e0;
    padding: 8px 10px; border-radius: 7px;
    font-size: 12px; line-height: 1.5;
    white-space: pre-wrap; word-break: break-all;
    max-height: 220px; overflow-y: auto;
  }
  .ev.file { background: rgba(46,204,113,.1); color: #7ddba3; font-family: ui-monospace, monospace; font-size: 12px; margin-left: 18px; }
  .ev .shot { display: block; margin-top: 8px; max-width: 100%; border-radius: 8px; border: 1px solid rgba(255,255,255,.12); }
  .stream-body { white-space: pre-wrap; word-break: break-word; }
  #send.stop { background: var(--danger); }

  /* 分享模式 */
  #shareBar {
    display: none;
    position: fixed; left: 0; right: 0; bottom: 0; z-index: 30;
    background: var(--surface); border-top: 1px solid rgba(255,255,255,.1);
    padding: 12px 16px; padding-bottom: calc(12px + env(safe-area-inset-bottom));
    align-items: center; gap: 12px; font-size: 14px;
  }
  #shareBar.show { display: flex; }
  #shareBar button { border: none; border-radius: 10px; padding: 9px 18px; font-size: 14px; background: var(--brand); color: #fff; }
  #shareBar #shareCancel { background: var(--surface-2); color: var(--text); }
  body.selecting .msg { cursor: pointer; }
  body.selecting .msg.selected { outline: 2px solid var(--brand); outline-offset: 2px; }
  #shareOverlay {
    display: none; position: fixed; inset: 0; z-index: 40;
    background: rgba(0,0,0,.85); align-items: center; justify-content: center;
  }
  #shareOverlay.show { display: flex; }
  .share-box { max-width: 92vw; max-height: 92dvh; display: flex; flex-direction: column; align-items: center; }
  .share-box img { max-width: 100%; max-height: 78dvh; border-radius: 12px; }

  /* 正在输入 */
  .typing { display: inline-flex; gap: 4px; padding: 4px 2px; }
  .typing i { width: 6px; height: 6px; border-radius: 50%; background: var(--muted); animation: blink 1.2s infinite; }
  .typing i:nth-child(2) { animation-delay: .2s; }
  .typing i:nth-child(3) { animation-delay: .4s; }
  @keyframes blink { 0%, 80%, 100% { opacity: .25; } 40% { opacity: 1; } }

  /* 底部输入区（两行：输入框 + 工具栏） */
  #composer {
    flex: 0 0 auto;
    display: flex;
    flex-direction: column;
    gap: 8px;
    padding: 10px 12px;
    padding-bottom: calc(10px + env(safe-area-inset-bottom));
    background: var(--surface);
    border-top: 1px solid rgba(255,255,255,.06);
  }
  #composerBar { display: flex; align-items: center; gap: 8px; }
  .cb-left { display: flex; gap: 8px; flex: 0 0 auto; }
  .cb-right { display: flex; gap: 8px; align-items: center; margin-left: auto; }
  .cb-btn {
    width: 34px; height: 34px; border: none; border-radius: 10px;
    background: var(--surface-2); color: var(--muted);
    font-size: 16px; cursor: pointer; flex: 0 0 auto;
  }
  .cb-btn.rec { color: #e8463a; }
  .cb-select {
    height: 34px; border: 1px solid rgba(255,255,255,.1); border-radius: 10px;
    background: var(--surface-2); color: var(--muted);
    font-size: 12.5px; padding: 0 8px; outline: none; max-width: 130px;
  }
  #input {
    width: 100%;
    min-height: 44px;
    max-height: 120px;
    padding: 12px 14px;
    border: none;
    border-radius: 14px;
    background: var(--surface-2);
    color: var(--text);
    font-size: 16px;
    font-family: inherit;
    resize: none;
    outline: none;
  }
  .msg img.chat-img { display: block; max-width: 100%; border-radius: 8px; margin: 6px 0; }
  /* 附件菜单 / 文件选择弹层 */
  #plusMenu, #fileList {
    display: none; position: fixed; z-index: 25;
    left: 12px; bottom: 120px;
    background: var(--surface-2); border: 1px solid rgba(255,255,255,.12);
    border-radius: 12px; padding: 6px; min-width: 200px;
    flex-direction: column; gap: 2px;
    box-shadow: 0 8px 30px rgba(0,0,0,.5);
  }
  #plusMenu.show { display: flex; }
  #fileList.show { display: flex; max-height: 40dvh; overflow-y: auto; }
  #plusMenu button, #fileList button {
    border: none; background: none; color: var(--text);
    text-align: left; padding: 10px 12px; border-radius: 8px;
    font-size: 14px; cursor: pointer;
  }
  #plusMenu button:hover, #fileList button:hover { background: rgba(255,255,255,.08); }
  #send {
    flex: 0 0 auto;
    min-width: 52px;
    height: 34px;
    border: none;
    border-radius: 10px;
    background: var(--brand);
    color: #fff;
    font-size: 15px;
    font-weight: 600;
    padding: 0 16px;
    cursor: pointer;
  }
  #send:disabled { opacity: .4; }

  /* token 输入遮罩 */
  #authOverlay {
    position: fixed; inset: 0;
    background: var(--bg);
    display: none;
    align-items: center;
    justify-content: center;
    flex-direction: column;
    gap: 14px;
    padding: 24px;
    z-index: 10;
  }
  #authOverlay.show { display: flex; }
  #authOverlay h1 { font-size: 20px; }
  #authOverlay p { color: var(--muted); font-size: 14px; text-align: center; line-height: 1.6; }
  #tokenInput {
    width: 100%; max-width: 320px;
    padding: 12px 14px;
    border: 1px solid rgba(255,255,255,.15);
    border-radius: 10px;
    background: var(--surface-2);
    color: var(--text);
    font-size: 16px;
    outline: none;
    text-align: center;
  }
  #tokenBtn {
    padding: 12px 32px;
    border: none; border-radius: 10px;
    background: var(--brand); color: #fff;
    font-size: 16px; font-weight: 600;
  }

  /* 设置按钮与面板 */
  #settingsBtn {
    flex: 0 0 auto;
    width: 36px; height: 36px;
    border: none; border-radius: 50%;
    background: var(--surface-2); color: var(--muted);
    font-size: 17px; cursor: pointer;
  }
  #settingsPanel {
    position: fixed; inset: 0;
    background: rgba(0,0,0,.5);
    display: none;
    align-items: flex-end;
    z-index: 20;
  }
  #settingsPanel.show { display: flex; }
  .sheet {
    background: var(--surface);
    width: 100%;
    border-radius: 16px 16px 0 0;
    padding: 18px 16px;
    padding-bottom: calc(18px + env(safe-area-inset-bottom));
    max-height: 85dvh;
    overflow-y: auto;
  }
  .sheet h2 { font-size: 17px; margin-bottom: 14px; }
  .field { margin-bottom: 14px; }
  .field label { display: block; font-size: 13px; color: var(--muted); margin-bottom: 6px; }
  .field input {
    width: 100%;
    padding: 12px 14px;
    border: 1px solid rgba(255,255,255,.12);
    border-radius: 10px;
    background: var(--surface-2);
    color: var(--text);
    font-size: 15px;
    outline: none;
    box-sizing: border-box;
  }
  .field-row { display: flex; align-items: center; justify-content: space-between; }
  .switch { position: relative; width: 46px; height: 26px; }
  .switch input { opacity: 0; width: 0; height: 0; }
  .slider {
    position: absolute; inset: 0; border-radius: 999px;
    background: var(--surface-2); transition: .15s;
  }
  .slider::before {
    content: ''; position: absolute; width: 20px; height: 20px;
    border-radius: 50%; background: var(--muted);
    top: 3px; left: 3px; transition: .15s;
  }
  .switch input:checked + .slider { background: var(--brand); }
  .switch input:checked + .slider::before { transform: translateX(20px); background: #fff; }
  #saveCfg {
    width: 100%;
    padding: 13px;
    border: none; border-radius: 10px;
    background: var(--brand); color: #fff;
    font-size: 16px; font-weight: 600;
    margin-top: 4px;
  }
  #cfgHint { text-align: center; font-size: 13px; color: var(--muted); margin-top: 10px; min-height: 18px; }
</style>
</head>
<body>

<header>
  <span class="dot" id="dot"></span>
  <span class="logo">DeckMate</span>
  <span class="status-text" id="statusText">连接中…</span>
  <span class="spacer"></span>
  <span class="badge" id="batteryBadge" hidden></span>
  <span class="badge" id="modeBadge" hidden></span>
  <button id="settingsBtn" title="设置">⚙</button>
</header>

<nav id="menuBar">
  <button class="menu-btn" id="btnNew">🆕 新会话</button>
  <button class="menu-btn" id="btnCompact">🗜 压缩上下文</button>
  <button class="menu-btn" id="btnShot">📷 截屏</button>
  <button class="menu-btn" id="btnRetry">↻ 重试</button>
  <button class="menu-btn" id="btnShare">↗ 分享</button>
  <span class="spacer"></span>
  <span class="badge" id="ctxBadge" hidden></span>
</nav>

<div id="shareBar">
  <span>已选 <b id="shareCount">0</b> 条</span>
  <button id="shareGo">生成图片</button>
  <button id="shareCancel">取消</button>
</div>

<div id="shareOverlay">
  <div class="share-box">
    <img id="shareImg" alt="对话分享图">
    <div style="display:flex; gap:10px; margin-top:12px;">
      <a id="shareDownload" download="deckmate-chat.png"><button class="menu-btn" style="padding:10px 20px;">⬇ 下载图片</button></a>
      <button class="menu-btn" id="shareClose" style="padding:10px 20px;">关闭</button>
    </div>
  </div>
</div>

<div id="messages"></div>

<div id="composer">
  <textarea id="input" rows="1" placeholder="@ 添加上下文，/ 使用命令" enterkeyhint="send"></textarea>
  <div id="composerBar">
    <div class="cb-left">
      <button class="cb-btn" id="btnPlus" title="添加附件/引用">＋</button>
      <select class="cb-select" id="permSelect" title="AI 控制权限">
        <option value="manual">🛡 手动审批</option>
        <option value="auto">🛡 智能审批</option>
        <option value="full">🛡 完全访问</option>
      </select>
    </div>
    <div class="cb-right">
      <select class="cb-select" id="modelSelect" title="模型"></select>
      <button class="cb-btn" id="btnMic" title="语音输入">🎤</button>
      <button id="send">发送</button>
    </div>
  </div>
</div>

<div id="plusMenu">
  <button id="pmImage">🖼 附加图片</button>
  <button id="pmFile">📄 引用工作区文件</button>
  <button id="pmShot">📷 引用当前屏幕截图</button>
</div>
<div id="fileList"></div>
<input type="file" id="imgInput" accept="image/*" hidden>

<div id="authOverlay">
  <h1>DeckMate 控制台</h1>
  <p>请输入访问令牌（token）。<br>令牌可在 Deck 的 ~/deckmate/server/config.toml 中查看。</p>
  <input id="tokenInput" type="password" placeholder="token" autocomplete="off">
  <button id="tokenBtn">连接</button>
</div>

<div id="settingsPanel">
  <div class="sheet">
    <h2>设置</h2>
    <div class="field">
      <label>API 接口地址（base_url）</label>
      <input id="cfgBaseUrl" type="text" placeholder="https://api.openai.com/v1" autocomplete="off">
    </div>
    <div class="field">
      <label>API Key</label>
      <input id="cfgApiKey" type="password" placeholder="sk-…" autocomplete="off">
    </div>
    <div class="field">
      <label>模型</label>
      <input id="cfgModel" type="text" placeholder="gpt-4o-mini" autocomplete="off">
    </div>
    <div class="field field-row">
      <label style="margin:0">语音播报回复</label>
      <span class="switch">
        <input id="cfgTts" type="checkbox">
        <span class="slider"></span>
      </span>
    </div>
    <div class="field">
      <label>AI 控制权限</label>
      <select id="cfgPerm" style="width:100%; padding:12px 14px; border:1px solid rgba(255,255,255,.12); border-radius:10px; background:var(--surface-2); color:var(--text); font-size:15px; outline:none;">
        <option value="manual">手动审批（每条命令都问你）</option>
        <option value="auto">智能审批（危险命令才问你）</option>
        <option value="full">完全访问（不再询问）</option>
      </select>
    </div>
    <div class="field">
      <label>工作区目录（编程/文件任务默认位置）</label>
      <input id="cfgWorkspace" type="text" placeholder="/home/deck/deckmate_workspace" autocomplete="off">
    </div>
    <button id="saveCfg">保存</button>
    <div id="cfgHint"></div>
  </div>
</div>

<script>
(function () {
  var messages = document.getElementById('messages');
  var input = document.getElementById('input');
  var sendBtn = document.getElementById('send');
  var dot = document.getElementById('dot');
  var statusText = document.getElementById('statusText');
  var batteryBadge = document.getElementById('batteryBadge');
  var modeBadge = document.getElementById('modeBadge');
  var ctxBadge = document.getElementById('ctxBadge');
  var authOverlay = document.getElementById('authOverlay');
  var tokenInput = document.getElementById('tokenInput');
  var tokenBtn = document.getElementById('tokenBtn');

  // token：URL > localStorage
  var token = new URLSearchParams(location.search).get('token') || localStorage.getItem('deckmate_token') || '';
  if (token) localStorage.setItem('deckmate_token', token);

  var ws = null;
  var typingEl = null;
  var reconnectTimer = null;
  var backoff = 1000;

  function fmtTime(ts) {
    var d = ts ? new Date(ts * 1000) : new Date();
    return d.getHours().toString().padStart(2, '0') + ':' + d.getMinutes().toString().padStart(2, '0');
  }

  function scrollBottom() {
    messages.scrollTop = messages.scrollHeight;
  }

  function escapeHtml(s) {
    return s.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
  }

  // 轻量 markdown 渲染（代码块/行内码/加粗/标题/列表/链接）
  function renderMd(t) {
    var s = escapeHtml(t);
    s = s.replace(/```(\w*)\n?([\s\S]*?)```/g, function (m, l, c) {
      return '<pre><code>' + c.replace(/\n$/, '') + '</code></pre>';
    });
    s = s.replace(/`([^`\n]+)`/g, '<code>$1</code>');
    s = s.replace(/\*\*([^*]+)\*\*/g, '<b>$1</b>');
    s = s.replace(/^#{1,4}\s+(.+)$/gm, '<h4>$1</h4>');
    s = s.replace(/(^|\n)((?:\s*[-*] .+(?:\n|$))+)/g, function (m, p, block) {
      var items = block.trim().split('\n').map(function (l) {
        return '<li>' + l.replace(/^\s*[-*] /, '') + '</li>';
      }).join('');
      return p + '<ul>' + items + '</ul>';
    });
    s = s.replace(/\[([^\]]+)\]\((https?:[^)\s]+)\)/g, '<a href="$2" target="_blank" rel="noopener">$1</a>');
    s = s.replace(/!\[([^\]]*)\]\((\/uploads\/[^)\s]+)\)/g, '<img class="chat-img" src="$2">');
    s = s.replace(/\n{2,}/g, '<br><br>').replace(/\n/g, '<br>');
    return s;
  }

  function addMsg(role, text, ts) {
    var el = document.createElement('div');
    el.className = 'msg ' + role;
    if (role === 'assistant' || role === 'user') {
      var body = document.createElement('div');
      body.innerHTML = renderMd(text);
      el.appendChild(body);
    } else {
      el.textContent = text;
    }
    var t = document.createElement('span');
    t.className = 'time';
    t.textContent = fmtTime(ts);
    el.appendChild(t);
    messages.appendChild(el);
    scrollBottomSafe();
  }

  // 渲染单个事件（思维链 / 工具调用+终端输出 / 文件改动）到容器
  function renderEvent(ev, box) {
    if (ev.type === 'thought') {
      var d = document.createElement('details');
      d.className = 'ev thought';
      var sum = document.createElement('summary');
      sum.textContent = '🧠 思维链（点击展开）';
      var body = document.createElement('div');
      body.className = 'thought-body';
      body.textContent = ev.text;
      d.appendChild(sum);
      d.appendChild(body);
      box.appendChild(d);
    } else if (ev.type === 'tool') {
      var t = document.createElement('div');
      t.className = 'ev tool' + (ev.approved ? ' approved' : '');
      var name = document.createElement('span');
      name.className = 'ev-name';
      name.textContent = (ev.approved ? '✓ ' : '🔧 ') + ev.name;
      var summary = document.createElement('span');
      summary.textContent = ev.summary || '';
      t.appendChild(name);
      t.appendChild(summary);
      if (ev.output) {
        var term = document.createElement('pre');
        term.className = 'term';
        term.textContent = ev.output;
        t.appendChild(term);
      }
      if (ev.image) {
        var img = document.createElement('img');
        img.className = 'shot';
        img.src = ev.image + '?token=' + encodeURIComponent(token);
        img.alt = '屏幕截图';
        img.addEventListener('click', function () { window.open(img.src, '_blank'); });
        t.appendChild(img);
      }
      box.appendChild(t);
      (ev.files || []).forEach(function (f) {
        var fc = document.createElement('div');
        fc.className = 'ev file';
        fc.textContent = '📄 写入 ' + f;
        box.appendChild(fc);
      });
    }
  }

  // 渲染整批事件（历史/兜底用）

  var liveBox = null;      // 本轮对话的事件容器（实时渲染工具终端块）
  var liveToolCount = 0;   // 已实时渲染的工具数，避免 assistant_message 重复渲染
  var liveThoughtShown = 0; // 已实时渲染的思维链数
  var liveThought = null;  // 实时思维链卡片（.thought-body 元素）
  var streamEl = null;     // 流式输出气泡
  var streamBody = null;

  function connect() {
    if (!token) { authOverlay.classList.add('show'); return; }
    var proto = location.protocol === 'https:' ? 'wss' : 'ws';
    ws = new WebSocket(proto + '://' + location.host + '/ws?token=' + encodeURIComponent(token));

    ws.onopen = function () {
      setConnected(true);
      backoff = 1000;
      authOverlay.classList.remove('show');
    };

    ws.onmessage = function (ev) {
      var msg;
      try { msg = JSON.parse(ev.data); } catch (e) { return; }
      switch (msg.type) {
        case 'history':
          messages.innerHTML = '';
          (msg.messages || []).forEach(function (m) {
            addMsg(m.role === 'user' ? 'user' : 'assistant', m.content);
          });
          break;
        case 'user_message':
          hideTyping();
          addMsg('user', msg.text, msg.ts);
          liveBox = document.createElement('div');
          liveBox.className = 'events';
          messages.appendChild(liveBox);
          liveToolCount = 0;
          liveThoughtShown = 0;
          liveThought = null;
          showTyping();
          break;
        case 'stream_start':
          hideTyping();
          streamEl = document.createElement('div');
          streamEl.className = 'msg assistant';
          streamBody = document.createElement('div');
          streamBody.className = 'stream-body';
          streamEl.appendChild(streamBody);
          messages.appendChild(streamEl);
          scrollBottomSafe();
          break;
        case 'delta':
          if (streamBody) {
            streamBody.textContent += msg.text;
            scrollBottomSafe();
          }
          break;
        case 'thought_start':
          if (!liveBox) {
            liveBox = document.createElement('div');
            liveBox.className = 'events';
            messages.appendChild(liveBox);
          }
          var td = document.createElement('details');
          td.className = 'ev thought';
          td.open = true;
          var tsum = document.createElement('summary');
          tsum.textContent = '🧠 思维链（思考中…）';
          var tbody = document.createElement('div');
          tbody.className = 'thought-body';
          td.appendChild(tsum);
          td.appendChild(tbody);
          liveBox.appendChild(td);
          liveThought = tbody;
          scrollBottomSafe();
          break;
        case 'thought_delta':
          if (liveThought) {
            liveThought.textContent += msg.text;
            scrollBottomSafe();
          }
          break;
        case 'thought_end':
          if (liveThought) {
            var sum2 = liveThought.previousSibling;
            if (sum2) sum2.textContent = '🧠 思维链（点击展开）';
            if (liveThought.parentNode) liveThought.parentNode.open = false;
          }
          liveThought = null;
          liveThoughtShown++;
          break;
        case 'tool_done':
          if (liveBox && msg.event) {
            renderEvent(msg.event, liveBox);
            liveToolCount++;
            scrollBottomSafe();
          }
          break;
        case 'assistant_message':
          hideTyping();
          setBusy(false);
          if (streamEl && streamEl.parentNode) streamEl.parentNode.removeChild(streamEl);
          streamEl = null; streamBody = null;
          if (msg.events && msg.events.length) {
            if (liveBox) {
              // 补渲染未实时显示的事件，跳过已显示的工具块与思维链
              var skip = liveToolCount, skipT = liveThoughtShown;
              msg.events.forEach(function (e) {
                if (e.type === 'tool' && skip > 0) { skip--; return; }
                if (e.type === 'thought' && skipT > 0) { skipT--; return; }
                renderEvent(e, liveBox);
              });
            } else {
              renderEvents(msg.events);
            }
          }
          if (liveBox && !liveBox.childNodes.length && liveBox.parentNode) {
            liveBox.parentNode.removeChild(liveBox);
          }
          liveBox = null; liveToolCount = 0; liveThoughtShown = 0;
          addMsg('assistant', msg.text, msg.ts);
          refreshStatus();  // 更新上下文用量徽标
          break;
        case 'tool_activity':
          showTyping('🔧 ' + msg.text);
          break;
        case 'status':
          renderStatus(msg.data || {});
          break;
        case 'system':
          addSystem(msg.text || '');
          break;
      }
    };

    ws.onclose = function (ev) {
      setConnected(false);
      hideTyping();
      if (ev.code === 4401) {
        localStorage.removeItem('deckmate_token');
        authOverlay.classList.add('show');
        return;
      }
      reconnectTimer = setTimeout(connect, backoff);
      backoff = Math.min(backoff * 2, 10000);
    };

    ws.onerror = function () { try { ws.close(); } catch (e) {} };
  }

  // 把选中的消息画到 canvas（深色卡片风格）
  document.getElementById('shareGo').addEventListener('click', function () {
    var picked = Array.prototype.slice.call(messages.querySelectorAll('.msg.selected'));
    if (!picked.length) return;
    var W = 760, PAD = 28, GAP = 14, BW = W - PAD * 2;
    var canvas = document.createElement('canvas');
    var ctx = canvas.getContext('2d');
    ctx.font = '16px system-ui, sans-serif';

    // 预排版：每条消息算出行和高度
    var items = picked.map(function (el) {
      var isUser = el.classList.contains('user');
      var text = el.textContent.replace(/\d{2}:\d{2}$/, '').trim();  // 去掉末尾时间
      var words = text.split(''), lines = [], line = '';
      var maxW = BW * (isUser ? 0.75 : 0.85) - 28;
      for (var i = 0; i < words.length; i++) {
        var test = line + words[i];
        if (ctx.measureText(test).width > maxW && line) { lines.push(line); line = words[i]; }
        else line = test;
      }
      if (line) lines.push(line);
      return { user: isUser, lines: lines, h: lines.length * 24 + 22 };
    });
    var H = PAD + 56 + items.reduce(function (s, it) { return s + it.h + GAP; }, 0) + PAD;
    canvas.width = W; canvas.height = H;

    // 背景 + 标题
    ctx.fillStyle = '#0f1117';
    ctx.fillRect(0, 0, W, H);
    ctx.font = 'bold 22px system-ui, sans-serif';
    ctx.fillStyle = '#1a9fff';
    ctx.fillText('DeckMate 对话', PAD, PAD + 10);
    ctx.font = '13px system-ui, sans-serif';
    ctx.fillStyle = '#8b91a3';
    ctx.fillText(new Date().toLocaleString(), PAD, PAD + 34);

    var y = PAD + 56;
    ctx.font = '16px system-ui, sans-serif';
    items.forEach(function (it) {
      var maxLineW = 0;
      it.lines.forEach(function (l) { maxLineW = Math.max(maxLineW, ctx.measureText(l).width); });
      var bw = Math.max(maxLineW + 28, 60);
      var x = it.user ? W - PAD - bw : PAD;
      // 气泡
      ctx.fillStyle = it.user ? '#1a9fff' : '#232737';
      var r = 14;
      ctx.beginPath();
      ctx.roundRect(x, y, bw, it.h, r);
      ctx.fill();
      // 文本
      ctx.fillStyle = it.user ? '#ffffff' : '#e8eaf0';
      it.lines.forEach(function (l, i) { ctx.fillText(l, x + 14, y + 30 + i * 24); });
      y += it.h + GAP;
    });

    var url = canvas.toDataURL('image/png');
    shareImg.src = url;
    shareDownload.href = url;
    shareOverlay.classList.add('show');
    document.getElementById('btnShare').click();  // 退出选择模式
  });

        fileList.classList.remove('show');
        c.run();
      });
      fileList.appendChild(b);
    });
    fileList.classList.add('show');
  });

  connect();
})();
</script>
