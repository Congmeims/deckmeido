<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#0f1117">
<link rel="icon" href="/logo.jpg">
<title>DeckMate</title>
<style>
  :root {
    --bg: #0f1117;
    --surface: #1a1d27;
    --surface-2: #232737;
    --text: #e8eaf0;
    --muted: #8b91a3;
    --brand: #1a9fff;
    --user-bubble: #1a9fff;
    --danger: #e8463a;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  html, body { height: 100%; }
  body {
    background: var(--bg);
    color: var(--text);
    font-family: "PingFang SC", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    font-size: 16px;
    display: flex;
    flex-direction: column;
    height: 100dvh;
    overflow: hidden;
  }

  /* 顶部状态栏 */
  header {
    flex: 0 0 auto;
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 10px 14px;
    padding-top: calc(10px + env(safe-area-inset-top));
    background: var(--surface);
    border-bottom: 1px solid var(--line);
  }
  .logo { font-weight: 600; font-size: 17px; }
  .dot { width: 9px; height: 9px; border-radius: 50%; background: var(--danger); flex: 0 0 auto; }
  .dot.on { background: #2ecc71; }
  .status-text { color: var(--muted); font-size: 12px; }
  .spacer { flex: 1; }
  .badge {
    font-size: 12px; color: var(--muted);
    background: var(--surface-2);
    padding: 4px 10px; border-radius: 999px;
    white-space: nowrap;
  }
  .badge.warn { color: #b8860b; }
  .badge.danger { color: #d0492b; }

  /* 横向菜单栏 */
  #menuBar {
    flex: 0 0 auto;
    display: flex; gap: 8px; align-items: center;
    padding: 8px 12px;
    background: var(--surface);
    border-bottom: 1px solid var(--line);
    overflow-x: auto;
  }
  .menu-btn {
    flex: 0 0 auto;
    border: 1px solid var(--line);
    background: var(--surface-2); color: var(--text);
    font-size: 13px; padding: 6px 12px; border-radius: 999px;
    cursor: pointer; white-space: nowrap;
  }
  .menu-btn:active { opacity: .7; }

  /* 消息区 */
  #messages {
    flex: 1 1 auto;
    overflow-y: auto;
    padding: 14px;
    display: flex;
    flex-direction: column;
    gap: 10px;
    -webkit-overflow-scrolling: touch;
  }
  .msg {
    max-width: 85%;
    padding: 10px 14px;
    border-radius: 16px;
    line-height: 1.55;
    font-size: 15.5px;
    white-space: pre-wrap;
    word-break: break-word;
  }
  .msg.user {
    align-self: flex-end;
    background: var(--user-bubble);
    color: #fff;
    border-bottom-right-radius: 4px;
  }
  .msg.assistant {
    align-self: flex-start;
    background: var(--surface-2);
    border-bottom-left-radius: 4px;
  }
  .msg.system {
    align-self: center;
    background: transparent;
    color: var(--muted);
    font-size: 13px;
    padding: 2px 8px;
  }
  .msg .time { display: block; margin-top: 4px; font-size: 11px; opacity: .55; }

  /* markdown 内容 */
  .msg pre { background: #0b0d13; padding: 10px 12px; border-radius: 8px; overflow-x: auto; margin: 6px 0; font-size: 13px; }
  .msg code { background: #0b0d13; padding: 2px 6px; border-radius: 5px; font-size: 13px; font-family: ui-monospace, monospace; }
  .msg pre code { background: none; padding: 0; }
  .msg h3, .msg h4 { margin: 8px 0 4px; color: var(--brand); }
  .msg ul { padding-left: 20px; margin: 4px 0; }
  .msg a { color: var(--brand); }

  /* 操作流水（Trae 式时间线：思考 / 工具调用 / 文件改动） */
  .events {
    align-self: flex-start;
    max-width: 92%;
    position: relative;
    padding-left: 24px;
    display: flex;
    flex-direction: column;
    gap: 2px;
  }
  .events::before {
    content: '';
    position: absolute; left: 8px; top: 12px; bottom: 12px;
    width: 1.5px; border-radius: 1px;
    background: rgba(255,255,255,.09);
  }
  .tl { position: relative; }
  .tl-head {
    display: flex; align-items: center; gap: 7px;
    font-size: 13px; color: var(--muted);
    padding: 3px 4px; border-radius: 7px;
    user-select: none; line-height: 1.4;
  }
  .tl-head.clickable { cursor: pointer; }
  .tl-head.clickable:hover { color: var(--text); background: var(--hover); }
  .tl-ico {
    position: absolute; left: -19px; top: 8px;
    width: 7px; height: 7px; border-radius: 50%;
    background: var(--muted); opacity: .55;
  }
  .tl-chip {
    background: var(--surface-2); border-radius: 6px;
    padding: 1px 7px; font-size: 12px;
    font-family: ui-monospace, monospace; color: var(--brand);
    max-width: 300px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  }
  .tl-arrow { font-size: 10px; opacity: .6; }
  .tl-body {
    display: none;
    margin: 3px 0 7px 4px;
    background: var(--surface-2);
    border-radius: 10px;
    padding: 9px 12px;
    font-size: 12.5px; line-height: 1.55;
    white-space: pre-wrap; word-break: break-word;
    color: var(--muted);
    max-height: 280px; overflow-y: auto;
  }
  .tl.open .tl-body { display: block; }
  .tl-body.term {
    background: #0b0d13; color: #c8d3e0;
    font-family: ui-monospace, monospace; font-size: 12px;
  }
  .tl-file {
    display: flex; gap: 8px; align-items: center;
    font-family: ui-monospace, monospace; font-size: 12.5px;
  }
  .tl-file .fname { color: var(--brand); }
  .tl-file .add { color: #2ecc71; }
  .tl-file .del { color: #e8463a; }
  .tl-body .shot { display: block; max-width: 100%; border-radius: 8px; border: 1px solid var(--line); }
  .stream-body { white-space: pre-wrap; word-break: break-word; }
  #send.stop { background: var(--danger); }

  /* 分享模式 */
  #shareBar {
    display: none;
    position: fixed; left: 0; right: 0; bottom: 0; z-index: 30;
    background: var(--surface); border-top: 1px solid var(--line);
    padding: 12px 16px; padding-bottom: calc(12px + env(safe-area-inset-bottom));
    align-items: center; gap: 12px; font-size: 14px;
  }
  #shareBar.show { display: flex; }
  #shareBar button { border: none; border-radius: 10px; padding: 9px 18px; font-size: 14px; background: var(--brand); color: #fff; }
  #shareBar #shareCancel { background: var(--surface-2); color: var(--text); }
  body.selecting .msg { cursor: pointer; }
  body.selecting .msg.selected { outline: 2px solid var(--brand); outline-offset: 2px; }
  #shareOverlay {
    display: none; position: fixed; inset: 0; z-index: 40;
    background: rgba(0,0,0,.85); align-items: center; justify-content: center;
  }
  #shareOverlay.show { display: flex; }
  .share-box { max-width: 92vw; max-height: 92dvh; display: flex; flex-direction: column; align-items: center; }
  .share-box img { max-width: 100%; max-height: 78dvh; border-radius: 12px; }

  /* 正在输入 */
  .typing { display: inline-flex; gap: 4px; padding: 4px 2px; }
  .typing i { width: 6px; height: 6px; border-radius: 50%; background: var(--muted); animation: blink 1.2s infinite; }
  .typing i:nth-child(2) { animation-delay: .2s; }
  .typing i:nth-child(3) { animation-delay: .4s; }
  @keyframes blink { 0%, 80%, 100% { opacity: .25; } 40% { opacity: 1; } }

  /* 底部输入区（两行：输入框 + 工具栏） */
  #composer {
    flex: 0 0 auto;
    display: flex;
    flex-direction: column;
    gap: 8px;
    padding: 10px 12px;
    padding-bottom: calc(10px + env(safe-area-inset-bottom));
    background: var(--surface);
    border-top: 1px solid var(--line);
  }
  #composerBar { display: flex; align-items: center; gap: 8px; }
  .cb-left { display: flex; gap: 8px; flex: 0 0 auto; }
  .cb-right { display: flex; gap: 8px; align-items: center; margin-left: auto; }
  .cb-btn {
    min-width: 34px; padding: 0 10px; height: 34px; border: none; border-radius: 10px;
    background: var(--surface-2); color: var(--muted);
    font-size: 16px; cursor: pointer; flex: 0 0 auto;
  }
  .cb-select {
    height: 34px; border: 1px solid var(--line); border-radius: 10px;
    background: var(--surface-2); color: var(--muted);
    font-size: 12.5px; padding: 0 8px; outline: none; max-width: 130px;
  }
  #input {
    width: 100%;
    min-height: 44px;
    max-height: 120px;
    padding: 12px 14px;
    border: none;
    border-radius: 14px;
    background: var(--surface-2);
    color: var(--text);
    font-size: 16px;
    font-family: inherit;
    resize: none;
    outline: none;
  }
  .msg img.chat-img { display: block; max-width: 100%; border-radius: 8px; margin: 6px 0; }
  /* 附件菜单 / 文件选择弹层 */
  #plusMenu, #fileList {
    display: none; position: fixed; z-index: 25;
    left: 12px; bottom: 120px;
    background: var(--surface-2); border: 1px solid var(--line);
    border-radius: 12px; padding: 6px; min-width: 200px;
    flex-direction: column; gap: 2px;
    box-shadow: 0 8px 30px rgba(0,0,0,.5);
  }
  #plusMenu.show { display: flex; }
  #fileList.show { display: flex; max-height: 40dvh; overflow-y: auto; }
  #plusMenu button, #fileList button {
    border: none; background: none; color: var(--text);
    text-align: left; padding: 10px 12px; border-radius: 8px;
    font-size: 14px; cursor: pointer;
  }
  #plusMenu button:hover, #fileList button:hover { background: var(--hover); }
  #send {
    flex: 0 0 auto;
    min-width: 52px;
    height: 34px;
    border: none;
    border-radius: 10px;
    background: var(--brand);
    color: #fff;
    font-size: 15px;
    font-weight: 600;
    padding: 0 16px;
    cursor: pointer;
  }
  #send:disabled { opacity: .4; }

  /* 等待发送队列（agent 运行时排队的消息） */
  #queueBox { display: none; flex-direction: column; gap: 6px; }
  #queueBox.show { display: flex; }
  .qchip {
    background: var(--surface-2);
    border: 1px solid var(--line);
    border-radius: 12px;
    padding: 8px 12px;
    font-size: 13.5px;
  }
  .qchip .q-text {
    overflow: hidden;
    display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical;
    word-break: break-word;
    margin-bottom: 4px;
  }
  .qchip .q-wait {
    border: none; background: none; color: var(--muted);
    font-size: 12.5px; cursor: pointer; padding: 2px 0;
  }
  .qchip .q-menu { display: none; flex-direction: column; gap: 2px; margin-top: 4px; }
  .qchip .q-menu.show { display: flex; }
  .qchip .q-menu button {
    border: none; background: none; color: var(--text);
    text-align: left; padding: 6px 8px; border-radius: 7px;
    font-size: 13px; cursor: pointer;
  }
  .qchip .q-menu button:hover { background: var(--hover); }
  .qchip .q-now { color: var(--brand); }

  /* token 输入遮罩 */
  #authOverlay {
    position: fixed; inset: 0;
    background: var(--bg);
    display: none;
    align-items: center;
    justify-content: center;
    flex-direction: column;
    gap: 14px;
    padding: 24px;
    z-index: 10;
  }
  #authOverlay.show { display: flex; }
  #authOverlay h1 { font-size: 20px; }
  #authOverlay p { color: var(--muted); font-size: 14px; text-align: center; line-height: 1.6; }
  #tokenInput {
    width: 100%; max-width: 320px;
    padding: 12px 14px;
    border: 1px solid var(--line);
    border-radius: 10px;
    background: var(--surface-2);
    color: var(--text);
    font-size: 16px;
    outline: none;
    text-align: center;
  }
  #tokenBtn {
    padding: 12px 32px;
    border: none; border-radius: 10px;
    background: var(--brand); color: #fff;
    font-size: 16px; font-weight: 600;
  }

  /* 设置按钮与面板 */
  #settingsBtn {
    flex: 0 0 auto;
    height: 36px; padding: 0 14px;
    border: 1px solid var(--line); border-radius: 10px;
    background: var(--surface-2); color: var(--muted);
    font-size: 13px; cursor: pointer;
  }
  #settingsPanel {
    position: fixed; inset: 0;
    background: rgba(0,0,0,.5);
    display: none;
    align-items: flex-end;
    z-index: 20;
  }
  #settingsPanel.show { display: flex; }
  .sheet {
    background: var(--surface);
    width: 100%;
    border-radius: 16px 16px 0 0;
    padding: 18px 16px;
    padding-bottom: calc(18px + env(safe-area-inset-bottom));
    max-height: 85dvh;
    overflow-y: auto;
  }
  .sheet h2 { font-size: 17px; margin-bottom: 14px; }
  .field { margin-bottom: 14px; }
  .field label { display: block; font-size: 13px; color: var(--muted); margin-bottom: 6px; }
  .field input {
    width: 100%;
    padding: 12px 14px;
    border: 1px solid var(--line);
    border-radius: 10px;
    background: var(--surface-2);
    color: var(--text);
    font-size: 15px;
    outline: none;
    box-sizing: border-box;
  }
  .field-row { display: flex; align-items: center; justify-content: space-between; }
  .switch { position: relative; width: 46px; height: 26px; }
  .switch input { opacity: 0; width: 0; height: 0; }
  .slider {
    position: absolute; inset: 0; border-radius: 999px;
    background: var(--surface-2); transition: .15s;
  }
  .slider::before {
    content: ''; position: absolute; width: 20px; height: 20px;
    border-radius: 50%; background: var(--muted);
    top: 3px; left: 3px; transition: .15s;
  }
  .switch input:checked + .slider { background: var(--brand); }
  .switch input:checked + .slider::before { transform: translateX(20px); background: #fff; }
  #saveCfg {
    width: 100%;
    padding: 13px;
    border: none; border-radius: 10px;
    background: var(--brand); color: #fff;
    font-size: 16px; font-weight: 600;
    margin-top: 4px;
  }
  #cfgHint { text-align: center; font-size: 13px; color: var(--muted); margin-top: 10px; min-height: 18px; }

  /* ===== 亮暗主题 + 分栏布局 ===== */
  :root { --line: rgba(255,255,255,.08); --hover: rgba(255,255,255,.07); }
  [data-theme=light] {
    --bg: #f2f4f8;
    --surface: #ffffff;
    --surface-2: #eaeef5;
    --text: #1c2333;
    --muted: #67707f;
    --brand: #0b7fd4;
    --line: rgba(16,24,40,.1);
    --hover: rgba(16,24,40,.06);
  }
  #app { display: flex; height: 100dvh; }
  #main { flex: 1; display: flex; flex-direction: column; min-width: 0; height: 100dvh; }
  #sidebar {
    width: 240px; flex: 0 0 auto;
    background: var(--surface);
    border-right: 1px solid var(--line);
    display: flex; flex-direction: column;
  }
  /* 系统状态卡 */
  .sys-card { padding: 14px 14px 12px; border-bottom: 1px solid var(--line); }
  .sys-head { display: flex; justify-content: space-between; align-items: baseline; font-size: 14px; font-weight: 600; margin-bottom: 10px; }
  .sys-ip { font-size: 11.5px; color: var(--muted); font-family: ui-monospace, monospace; font-weight: 400; }
  .sys-row { display: flex; align-items: center; gap: 8px; margin: 7px 0; font-size: 12px; color: var(--muted); }
  .sys-name { flex: 0 0 30px; }
  .bar { flex: 1; height: 6px; border-radius: 3px; background: var(--surface-2); overflow: hidden; }
  .fill { height: 100%; width: 0%; border-radius: 3px; background: var(--brand); transition: width .4s; }
  .fill.hot { background: var(--danger); }
  .sys-val { flex: 0 0 auto; font-size: 11px; font-family: ui-monospace, monospace; min-width: 36px; text-align: right; }
  .sys-sub { margin-top: 9px; font-size: 11px; color: var(--muted); line-height: 1.5; }
  /* 会话列表 */
  .sb-sess-head {
    display: flex; align-items: center; justify-content: space-between;
    padding: 10px 14px 6px; font-size: 13px; color: var(--muted);
  }
  #btnNewSess {
    border: 1px solid var(--line); background: var(--surface-2); color: var(--text);
    width: 24px; height: 24px; border-radius: 7px; cursor: pointer; font-size: 14px; line-height: 1;
  }
  #sessList { flex: 1; overflow-y: auto; padding: 0 8px 8px; display: flex; flex-direction: column; gap: 2px; }
  .sess {
    display: flex; align-items: center; gap: 6px;
    padding: 8px 10px; border-radius: 9px; cursor: pointer;
    font-size: 13px; color: var(--text);
  }
  .sess:hover { background: var(--hover); }
  .sess.current { background: var(--surface-2); }
  .sess .s-title { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .sess .s-del {
    border: none; background: none; color: var(--muted); cursor: pointer;
    font-size: 12px; padding: 2px 5px; border-radius: 5px; flex: 0 0 auto; opacity: 0;
  }
  .sess:hover .s-del { opacity: 1; }
  .sess .s-del.confirm { opacity: 1; color: #fff; background: var(--danger); }
  .sb-foot { padding: 10px 14px; border-top: 1px solid var(--line); }
  #btnTheme {
    width: 100%; border: 1px solid var(--line); background: var(--surface-2);
    color: var(--text); border-radius: 9px; padding: 8px; font-size: 13px; cursor: pointer;
  }
  #btnMenu { display: none; }
  @media (max-width: 760px) {
    #sidebar {
      position: fixed; z-index: 15; left: 0; top: 0; bottom: 0;
      transform: translateX(-105%); transition: transform .2s;
      box-shadow: 0 0 40px rgba(0,0,0,.4);
    }
    body.sb-open #sidebar { transform: none; }
    #btnMenu { display: block; }
  }
  /* 代码块全屏查看 */
  #codeView { display: none; position: fixed; inset: 0; z-index: 45; background: rgba(0,0,0,.7); align-items: center; justify-content: center; }
  #codeView.show { display: flex; }
  #codeBox { width: min(920px, 94vw); max-height: 86dvh; background: #0b0d13; border-radius: 12px; display: flex; flex-direction: column; overflow: hidden; }
  #codeBox .cv-bar { display: flex; align-items: center; gap: 10px; padding: 10px 14px; background: var(--surface); }
  #codePre { flex: 1; overflow: auto; padding: 14px; color: #c8d3e0; font-family: ui-monospace, monospace; font-size: 13px; white-space: pre-wrap; word-break: break-word; margin: 0; }
  .msg pre { cursor: pointer; }
</style>
</head>
<body>

<div id="app">
<aside id="sidebar">
  <div class="sys-card">
    <div class="sys-head"><span>Steam Deck</span><span class="sys-ip" id="sysIp">–</span></div>
    <div class="sys-row"><span class="sys-name">CPU</span><div class="bar"><div class="fill" id="cpuFill"></div></div><span class="sys-val" id="cpuVal">–</span></div>
    <div class="sys-row"><span class="sys-name">内存</span><div class="bar"><div class="fill" id="memFill"></div></div><span class="sys-val" id="memVal">–</span></div>
    <div class="sys-row"><span class="sys-name">硬盘</span><div class="bar"><div class="fill" id="diskFill"></div></div><span class="sys-val" id="diskVal">–</span></div>
    <div class="sys-sub" id="sysSub"></div>
  </div>
  <div class="sb-sess-head"><span>会话</span><button id="btnNewSess" title="新会话">＋</button></div>
  <div id="sessList"></div>
  <div class="sb-foot"><button id="btnTheme">切换主题</button></div>
</aside>
<main id="main">

<header>
  <button class="cb-btn" id="btnMenu" title="菜单">菜单</button>
  <span class="dot" id="dot"></span>
  <span class="logo">DeckMate</span>
  <span class="status-text" id="statusText">连接中…</span>
  <span class="spacer"></span>
  <span class="badge" id="batteryBadge" hidden></span>
  <span class="badge" id="modeBadge" hidden></span>
  <button id="settingsBtn" title="设置">设置</button>
</header>

<nav id="menuBar">
  <button class="menu-btn" id="btnNew">新会话</button>
  <button class="menu-btn" id="btnShot">截屏</button>
  <button class="menu-btn" id="btnRetry">重试</button>
  <button class="menu-btn" id="btnShare">分享</button>
  <span class="spacer"></span>
  <span class="badge" id="ctxBadge" hidden></span>
</nav>

<div id="shareBar">
  <span>已选 <b id="shareCount">0</b> 条</span>
  <button id="shareGo">生成图片</button>
  <button id="shareCancel">取消</button>
</div>

<div id="shareOverlay">
  <div class="share-box">
    <img id="shareImg" alt="对话分享图">
    <div style="display:flex; gap:10px; margin-top:12px;">
      <a id="shareDownload" download="deckmate-chat.png"><button class="menu-btn" style="padding:10px 20px;">下载图片</button></a>
      <button class="menu-btn" id="shareClose" style="padding:10px 20px;">关闭</button>
    </div>
  </div>
</div>

<div id="messages"></div>

<div id="composer">
  <div id="queueBox"></div>
  <textarea id="input" rows="1" placeholder="@ 添加上下文，/ 使用命令" enterkeyhint="send"></textarea>
  <div id="composerBar">
    <div class="cb-left">
      <button class="cb-btn" id="btnPlus" title="添加附件/引用" style="font-size:16px">＋</button>
      <select class="cb-select" id="permSelect" title="AI 控制权限">
        <option value="manual">手动审批</option>
        <option value="auto">智能审批</option>
        <option value="full">完全访问</option>
      </select>
    </div>
    <div class="cb-right">
      <select class="cb-select" id="modelSelect" title="模型"></select>
      <button id="send">发送</button>
    </div>
  </div>
</div>

</main>
</div>

<div id="authOverlay">
  <h1>DeckMate 控制台</h1>
  <p>请输入访问令牌（token）。<br>令牌可在 Deck 的 ~/deckmate/server/config.toml 中查看。</p>
  <input id="tokenInput" type="password" placeholder="token" autocomplete="off">
  <button id="tokenBtn">连接</button>
</div>

<div id="settingsPanel">
  <div class="sheet">
    <h2>设置</h2>
    <div class="field">
      <label>API 接口地址（base_url）</label>
      <input id="cfgBaseUrl" type="text" placeholder="https://api.openai.com/v1" autocomplete="off">
    </div>
    <div class="field">
      <label>API Key</label>
      <input id="cfgApiKey" type="password" placeholder="sk-…" autocomplete="off">
    </div>

      <label style="margin:0">语音播报回复</label>
      <span class="switch">
        <input id="cfgTts" type="checkbox">
        <span class="slider"></span>
      </span>
    </div>

      <label>AI 控制权限</label>
      <select id="cfgPerm" style="width:100%; padding:12px 14px; border:1px solid var(--line); border-radius:10px; background:var(--surface-2); color:var(--text); font-size:15px; outline:none;">
        <option value="manual">手动审批（每条命令都问你）</option>
        <option value="auto">智能审批（危险命令才问你）</option>

      </select>

      <input id="cfgWorkspace" type="text" placeholder="/home/deck/deckmate_workspace" autocomplete="off">
    </div>

<script>
(function () {
  var messages = document.getElementById('messages');
  var input = document.getElementById('input');
  var sendBtn = document.getElementById('send');
  var dot = document.getElementById('dot');
  var statusText = document.getElementById('statusText');
  var batteryBadge = document.getElementById('batteryBadge');
  var modeBadge = document.getElementById('modeBadge');
  var ctxBadge = document.getElementById('ctxBadge');
  var authOverlay = document.getElementById('authOverlay');
  var tokenInput = document.getElementById('tokenInput');
  var tokenBtn = document.getElementById('tokenBtn');

  // token：URL > localStorage
  var token = new URLSearchParams(location.search).get('token') || localStorage.getItem('deckmate_token') || '';
  if (token) localStorage.setItem('deckmate_token', token);

  var ws = null;
  var typingEl = null;
  var reconnectTimer = null;
  var backoff = 1000;

  function fmtTime(ts) {
    var d = ts ? new Date(ts * 1000) : new Date();
    return d.getHours().toString().padStart(2, '0') + ':' + d.getMinutes().toString().padStart(2, '0');
  }

  function scrollBottom() {
    messages.scrollTop = messages.scrollHeight;
  }

  function escapeHtml(s) {
    return s.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
  }

  // 轻量 markdown 渲染（代码块/行内码/加粗/标题/列表/链接）
  function renderMd(t) {
    var s = escapeHtml(t);
    s = s.replace(/```(\w*)\n?([\s\S]*?)```/g, function (m, l, c) {
      return '<pre><code>' + c.replace(/\n$/, '') + '</code></pre>';
    });
    s = s.replace(/`([^`\n]+)`/g, '<code>$1</code>');
    s = s.replace(/\*\*([^*]+)\*\*/g, '<b>$1</b>');
    s = s.replace(/^#{1,4}\s+(.+)$/gm, '<h4>$1</h4>');
    s = s.replace(/(^|\n)((?:\s*[-*] .+(?:\n|$))+)/g, function (m, p, block) {
      var items = block.trim().split('\n').map(function (l) {
        return '<li>' + l.replace(/^\s*[-*] /, '') + '</li>';
      }).join('');
      return p + '<ul>' + items + '</ul>';
    });
    s = s.replace(/\[([^\]]+)\]\((https?:[^)\s]+)\)/g, '<a href="$2" target="_blank" rel="noopener">$1</a>');
    s = s.replace(/!\[([^\]]*)\]\((\/uploads\/[^)\s]+)\)/g, '<img class="chat-img" src="$2">');
    s = s.replace(/\n{2,}/g, '<br><br>').replace(/\n/g, '<br>');
    return s;
  }

  function addMsg(role, text, ts) {
    var el = document.createElement('div');
    el.className = 'msg ' + role;
    if (role === 'assistant' || role === 'user') {
      var body = document.createElement('div');
      body.innerHTML = renderMd(text);
      el.appendChild(body);
    } else {
      el.textContent = text;
    }
    var t = document.createElement('span');
    t.className = 'time';
    t.textContent = fmtTime(ts);
    el.appendChild(t);
    messages.appendChild(el);
    scrollBottomSafe();
  }

  // 工具事件 → 时间线行文案（Trae 式：已读取/已编辑/已运行…）
  function toolRowInfo(ev) {
    var fname = ev.path ? (ev.path.split(/[\\/]/).pop() || ev.path) : '';
    switch (ev.name) {
      case 'read_file':   return { text: '已读取', chip: fname || ev.summary };
      case 'list_dir':    return { text: '已查看目录', chip: fname || ev.summary };
      case 'write_file':
      case 'edit_file':   return { text: '已编辑 1个文件' };
      case 'run_command': return { text: '已运行', chip: ev.summary };
      case 'screenshot':  return { text: '已截屏' };
      case 'get_weather': return { text: '已查询天气', chip: ev.summary };
      case 'web_search':  return { text: '已搜索', chip: ev.summary };
      case 'list_installed_games': return { text: '已查询游戏库' };
      case 'find_game':   return { text: '已在商店搜索', chip: ev.summary };
      case 'list_emulator_roms': return { text: '已扫描模拟器 ROM' };
      case 'check_system_updates': return { text: '已检查系统更新' };
      case 'install_game': return { text: '已安装游戏', chip: ev.summary };
      default:            return { text: '已完成 ' + (ev.label || ev.name), chip: ev.summary };
    }
  }

  // 通用时间线行：head（节点+文案+箭头）+ 可展开 body
  function makeTlRow(text, chip, open) {
    var tl = document.createElement('div');
    tl.className = 'tl';
    var head = document.createElement('div');
    head.className = 'tl-head clickable';
    var ic = document.createElement('span');
    ic.className = 'tl-ico';
    var tx = document.createElement('span');
    tx.textContent = text;
    head.appendChild(ic); head.appendChild(tx);
    head.addEventListener('click', function () {
      tl.classList.toggle('open');
      var a = head.querySelector('.tl-arrow');
      if (a) a.textContent = tl.classList.contains('open') ? '▾' : '▸';
    });
    tl.appendChild(head);
    return { tl: tl, head: head };
  }

  // 思维链行（live 流式与历史渲染共用）
  function makeThoughtRow(text, open) {
    var r = makeTlRow('思考', null, open);
    var arrow = document.createElement('span');
    arrow.className = 'tl-arrow';
    arrow.textContent = open ? '▾' : '▸';
    r.head.appendChild(arrow);
    var body = document.createElement('div');
    body.className = 'tl-body';
    body.textContent = text || '';
    r.tl.appendChild(body);
    if (open) r.tl.classList.add('open');
    return r.tl;
  }

  // 渲染单个事件（思维链 / 工具调用+终端输出 / 文件改动）到容器
  function renderEvent(ev, box) {
    if (ev.type === 'thought') {
      box.appendChild(makeThoughtRow(ev.text, false));
      return;
    }
    if (ev.type !== 'tool') return;
    var info = toolRowInfo(ev);
    var hasBody = !!(ev.output || ev.image || ev.diff || (ev.files && ev.files.length));
    var r = makeTlRow(ev.approved ? ('已批准：' + (ev.summary || '')) : info.text,
                      null, false);
    if (!ev.approved && info.chip) {
      var chipEl = document.createElement('span');
      chipEl.className = 'tl-chip';
      chipEl.textContent = info.chip;
      r.head.appendChild(chipEl);
    }
    if (!hasBody) {
      r.head.classList.remove('clickable');
    } else {
      var arrow = document.createElement('span');
      arrow.className = 'tl-arrow';
      arrow.textContent = '▸';
      r.head.appendChild(arrow);
      var body = document.createElement('div');
      body.className = 'tl-body' + (ev.name === 'run_command' ? ' term' : '');
      if (ev.diff && ev.path) {
        // 文件改动行：文件名 + 增删行数
        var fr = document.createElement('div');
        fr.className = 'tl-file';
        var fn = document.createElement('span'); fn.className = 'fname';
        fn.textContent = ev.path.split(/[\\/]/).pop() || ev.path;
        var ad = document.createElement('span'); ad.className = 'add';
        ad.textContent = '+' + (ev.diff.add || 0);
        var dl = document.createElement('span'); dl.className = 'del';
        dl.textContent = '-' + (ev.diff.del || 0);
        fr.appendChild(fn); fr.appendChild(ad); fr.appendChild(dl);
        body.appendChild(fr);
        // 编辑失败时附上输出
        if (ev.output && /失败|不存在|错误/.test(ev.output)) {
          var err = document.createElement('div');
          err.style.marginTop = '6px';
          err.textContent = ev.output;
          body.appendChild(err);
        }
      } else if (ev.image) {
        var img = document.createElement('img');
        img.className = 'shot';
        img.src = ev.image + '?token=' + encodeURIComponent(token);
        img.alt = '屏幕截图';
        body.appendChild(img);
      } else if (ev.output) {
        body.textContent = ev.output;
      }
      // run_command 识别到的写入文件
      (ev.files || []).forEach(function (f) {
        var fr2 = document.createElement('div');
        fr2.className = 'tl-file';
        fr2.textContent = '写入 ';
        var fn2 = document.createElement('span'); fn2.className = 'fname';
        fn2.textContent = f;
        fr2.appendChild(fn2);
        body.appendChild(fr2);
      });
      r.tl.appendChild(body);
    }
    box.appendChild(r.tl);
  }

  // 渲染整批事件（历史/兜底用）
  function renderEvents(events) {
    if (!events || !events.length) return;
    var box = document.createElement('div');
    box.className = 'events';
    events.forEach(function (ev) { renderEvent(ev, box); });
    messages.appendChild(box);
    scrollBottomSafe();
  }

  function addSystem(text) {
    var el = document.createElement('div');
    el.className = 'msg system';
    el.textContent = text;
    messages.appendChild(el);
    scrollBottomSafe();
  }

  function showTyping(label) {
    hideTyping();
    typingEl = document.createElement('div');
    typingEl.className = 'msg assistant';
    typingEl.innerHTML = '<span class="typing"><i></i><i></i><i></i></span>';
    if (label) {
      var l = document.createElement('span');
      l.style.cssText = 'color:var(--muted);font-size:12.5px;margin-left:8px;';
      l.textContent = label;
      typingEl.appendChild(l);
    }
    messages.appendChild(typingEl);
    scrollBottomSafe();
  }

  function hideTyping() {
    if (typingEl && typingEl.parentNode) typingEl.parentNode.removeChild(typingEl);
    typingEl = null;
  }

  // 键盘弹出时保持滚动到底部
  function scrollBottomSafe() {
    requestAnimationFrame(scrollBottom);
  }
  if (window.visualViewport) {
    window.visualViewport.addEventListener('resize', scrollBottomSafe);
  }

  function setConnected(ok) {
    dot.className = ok ? 'dot on' : 'dot';
    statusText.textContent = ok ? '已连接' : '已断开，重连中…';
    sendBtn.disabled = !ok;
  }

  var liveBox = null;      // 本轮对话的事件容器（实时渲染工具终端块）
  var liveToolCount = 0;   // 已实时渲染的工具数，避免 assistant_message 重复渲染
  var liveThoughtShown = 0; // 已实时渲染的思维链数
  var liveThought = null;  // 实时思维链卡片（.thought-body 元素）
  var streamEl = null;     // 流式输出气泡
  var streamBody = null;

  function connect() {
    if (!token) { authOverlay.classList.add('show'); return; }
    var proto = location.protocol === 'https:' ? 'wss' : 'ws';
    ws = new WebSocket(proto + '://' + location.host + '/ws?token=' + encodeURIComponent(token));

    ws.onopen = function () {
      setConnected(true);
      backoff = 1000;
      authOverlay.classList.remove('show');
    };

    ws.onmessage = function (ev) {
      var msg;
      try { msg = JSON.parse(ev.data); } catch (e) { return; }
      switch (msg.type) {
        case 'history':
          messages.innerHTML = '';
          (msg.messages || []).forEach(function (m) {
            addMsg(m.role === 'user' ? 'user' : 'assistant', m.content);
          });
          break;
        case 'user_message':
          hideTyping();
          addMsg('user', msg.text, msg.ts);
          liveBox = document.createElement('div');
          liveBox.className = 'events';
          messages.appendChild(liveBox);
          liveToolCount = 0;
          liveThoughtShown = 0;
          liveThought = null;
          showTyping();
          break;
        case 'stream_start':
          hideTyping();
          streamEl = document.createElement('div');
          streamEl.className = 'msg assistant';
          streamBody = document.createElement('div');
          streamBody.className = 'stream-body';
          streamEl.appendChild(streamBody);
          messages.appendChild(streamEl);
          scrollBottomSafe();
          break;
        case 'delta':
          if (streamBody) {
            streamBody.textContent += msg.text;
            scrollBottomSafe();
          }
          break;
        case 'thought_start':
          if (!liveBox) {
            liveBox = document.createElement('div');
            liveBox.className = 'events';
            messages.appendChild(liveBox);
          }
          var trow = makeThoughtRow('', true);
          liveBox.appendChild(trow);
          liveThought = trow.querySelector('.tl-body');
          scrollBottomSafe();
          break;
        case 'thought_delta':
          if (liveThought) {
            liveThought.textContent += msg.text;
            scrollBottomSafe();
          }
          break;
        case 'thought_end':
          if (liveThought) {
            // 思考结束后折叠为「思考 ▸」行，点击可展开
            var trow2 = liveThought.parentNode;
            trow2.classList.remove('open');
            var tarr = trow2.querySelector('.tl-arrow');
            if (tarr) tarr.textContent = '▸';
          }
          liveThought = null;
          liveThoughtShown++;
          break;
        case 'tool_done':
          if (liveBox && msg.event) {
            renderEvent(msg.event, liveBox);
            liveToolCount++;
            scrollBottomSafe();
          }
          break;
        case 'assistant_message':
          hideTyping();
          setBusy(false);
          if (streamEl && streamEl.parentNode) streamEl.parentNode.removeChild(streamEl);
          streamEl = null; streamBody = null;
          if (msg.events && msg.events.length) {
            if (liveBox) {
              // 补渲染未实时显示的事件，跳过已显示的工具块与思维链
              var skip = liveToolCount, skipT = liveThoughtShown;
              msg.events.forEach(function (e) {
                if (e.type === 'tool' && skip > 0) { skip--; return; }
                if (e.type === 'thought' && skipT > 0) { skipT--; return; }
                renderEvent(e, liveBox);
              });
            } else {
              renderEvents(msg.events);
            }
          }
          if (liveBox && !liveBox.childNodes.length && liveBox.parentNode) {
            liveBox.parentNode.removeChild(liveBox);
          }
          liveBox = null; liveToolCount = 0; liveThoughtShown = 0;
          addMsg('assistant', msg.text, msg.ts);
          refreshStatus();  // 更新上下文用量徽标
          flushQueue(!!msg.cancelled);  // 有排队消息则自动发出
          break;
        case 'tool_activity':
          showTyping(msg.text);
          break;
        case 'status':
          renderStatus(msg.data || {});
          break;
        case 'system':
          addSystem(msg.text || '');
          break;
        case 'session_changed':
          loadSessions();
          break;
      }
    };

    ws.onclose = function (ev) {
      setConnected(false);
      hideTyping();
      if (ev.code === 4401) {
        localStorage.removeItem('deckmate_token');
        authOverlay.classList.add('show');
        return;
      }
      reconnectTimer = setTimeout(connect, backoff);
      backoff = Math.min(backoff * 2, 10000);
    };

    ws.onerror = function () { try { ws.close(); } catch (e) {} };
  }

  // token 数简写：12345 → 12.3k，1234567 → 1.2M
  function fmtTokens(n) {
    if (!n) return '0';
    if (n >= 1000000) return (n / 1000000).toFixed(1) + 'M';
    if (n >= 1000) return (n / 1000).toFixed(n >= 100000 ? 0 : 1) + 'k';
    return String(n);
  }

  function renderStatus(s) {
    if (s.battery != null) {
      batteryBadge.hidden = false;
      batteryBadge.textContent = s.battery + '%' + (s.charging === 'Charging' ? ' 充电中' : '');
    }
    if (s.mode) {
      modeBadge.hidden = false;
      modeBadge.textContent = s.mode === 'gaming' ? '游戏模式' : '桌面模式';
    }
    if (s.context) {
      ctxBadge.hidden = false;
      var c = s.context;
      var pct = c.percent || 0;
      ctxBadge.textContent = '上下文 ' + pct + '%' + (c.used ? (' · ' + fmtTokens(c.used) + '/' + fmtTokens(c.window)) : '');
      ctxBadge.title = '模型窗口 ' + (c.window || 0).toLocaleString() + ' tokens'
        + (c.used ? ('\n当前约 ' + c.used.toLocaleString() + ' tokens') : '')
        + '\n达到 ' + c.compact_at + '% 时自动压缩';
      // 用量越接近上限越醒目：85% 起变黄，95% 变红
      ctxBadge.classList.toggle('warn', pct >= 85 && pct < 95);
      ctxBadge.classList.toggle('danger', pct >= 95);
    }
    if (s.llm_configured === false) {
      addSystem('提示：LLM API Key 未配置，详见 config.toml');
    }
  }

  var busy = false;
  var queueBox = document.getElementById('queueBox');
  var msgQueue = [];              // 等待发送的消息
  var forceSendAfterCancel = null; // 「立即发送」：终止当前后要立刻发出去的文本

  // ---------- 等待发送队列 ----------
  function renderQueue() {
    queueBox.innerHTML = '';
    queueBox.classList.toggle('show', msgQueue.length > 0);
    msgQueue.forEach(function (text, i) {
      var chip = document.createElement('div');
      chip.className = 'qchip';
      var t = document.createElement('div');
      t.className = 'q-text';
      t.textContent = text;
      chip.appendChild(t);
      var wait = document.createElement('button');
      wait.className = 'q-wait';
      wait.textContent = '⏳ 等待发送… ⌄';
      chip.appendChild(wait);
      var menu = document.createElement('div');
      menu.className = 'q-menu';
      var now = document.createElement('button');
      now.className = 'q-now';
      now.textContent = '立即发送（终止当前操作）';
      now.addEventListener('click', function () { sendQueuedNow(i); });
      var drop = document.createElement('button');
      drop.textContent = '取消等待（放回输入框）';
      drop.addEventListener('click', function () {
        msgQueue.splice(i, 1);
        input.value = input.value ? input.value + '\n' + text : text;
        input.dispatchEvent(new Event('input'));
        renderQueue();
        input.focus();
      });
      menu.appendChild(now);
      menu.appendChild(drop);
      chip.appendChild(menu);
      wait.addEventListener('click', function () { menu.classList.toggle('show'); });
      queueBox.appendChild(chip);
    });
  }

  // 「立即发送」：终止当前操作，完成后发这条
  function sendQueuedNow(i) {
    var text = msgQueue[i];
    msgQueue.splice(i, 1);
    renderQueue();
    if (!busy) { doSend(text); return; }
    forceSendAfterCancel = text;
    fetch('/api/cancel?token=' + encodeURIComponent(token), { method: 'POST' })
      .catch(function () {});
  }

  // 一轮结束后：自动发出排队的下一条
  function flushQueue(cancelled) {
    if (forceSendAfterCancel) {
      var ft = forceSendAfterCancel;
      forceSendAfterCancel = null;
      doSend(ft);
      return;
    }
    // 手动终止后不自动发，保留队列等用户决定
    if (cancelled || !msgQueue.length) return;
    doSend(msgQueue.shift());
    renderQueue();
  }

  function updateSendBtn() {
    // 运行中且输入框为空 → ⏹ 终止；运行中但有文字 → 发送（排队）
    if (busy && !input.value.trim()) {
      sendBtn.textContent = '⏹';
      sendBtn.classList.add('stop');
    } else {
      sendBtn.textContent = '发送';
      sendBtn.classList.remove('stop');
    }
  }

  function refreshStatus() {
    fetch('/api/status?token=' + encodeURIComponent(token))
      .then(function (r) { return r.ok ? r.json() : null; })
      .then(function (s) { if (s) renderStatus(s); })
      .catch(function () {});
  }
  setInterval(refreshStatus, 30000);

  // 菜单栏按钮
  document.getElementById('btnNew').addEventListener('click', function () {
    fetch('/api/sessions/create?token=' + encodeURIComponent(token), { method: 'POST' })
      .then(function () { refreshStatus(); })
      .catch(function () { addSystem('操作失败'); });
  });
  document.getElementById('btnShot').addEventListener('click', function () {
    if (ws && ws.readyState === 1 && !busy) {
      ws.send(JSON.stringify({ type: 'chat', text: '截屏，把当前桌面画面展示给我' }));
      setBusy(true);
    }
  });
  // 重试：撤掉上一条 AI 回复并让模型重新回答
  document.getElementById('btnRetry').addEventListener('click', function () {
    if (busy) return;
    // 本地移除最后一条 assistant 气泡和它前面的事件容器
    var last = messages.lastElementChild;
    if (last && last.classList.contains('msg') && last.classList.contains('assistant')) {
      messages.removeChild(last);
      var prev = messages.lastElementChild;
      if (prev && prev.classList.contains('events')) messages.removeChild(prev);
    }
    setBusy(true);
    showTyping();
    fetch('/api/retry?token=' + encodeURIComponent(token), { method: 'POST' })
      .then(function (r) { if (!r.ok) { hideTyping(); setBusy(false); addSystem('没有可重试的消息'); } })
      .catch(function () { hideTyping(); setBusy(false); });
  });

  function setBusy(b) {
    busy = b;
    updateSendBtn();
  }

  function doSend(text) {
    if (!text || !ws || ws.readyState !== 1) return;
    ws.send(JSON.stringify({ type: 'chat', text: text }));
    setBusy(true);
  }

  function send() {
    var text = input.value.trim();
    if (busy) {
      if (text) {
        // agent 运行中：排队等待发送（Trae 式）
        msgQueue.push(text);
        renderQueue();
        input.value = '';
        input.style.height = 'auto';
        updateSendBtn();
        input.focus();
      } else {
        // 输入框为空：⏹ 终止当前操作
        fetch('/api/cancel?token=' + encodeURIComponent(token), { method: 'POST' })
          .catch(function () {});
        setBusy(false);
        hideTyping();
      }
      return;
    }
    if (!text) return;
    doSend(text);
    input.value = '';
    input.style.height = 'auto';
    input.focus();
  }

  sendBtn.addEventListener('click', send);
  input.addEventListener('keydown', function (e) {
    if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); send(); }
  });
  input.addEventListener('input', function () {
    input.style.height = 'auto';
    input.style.height = Math.min(input.scrollHeight, 120) + 'px';
    updateSendBtn();
  });

  tokenBtn.addEventListener('click', function () {
    var t = tokenInput.value.trim();
    if (!t) return;
    token = t;
    localStorage.setItem('deckmate_token', t);
    connect();
  });

  // ---------- 设置面板 ----------
  var settingsBtn = document.getElementById('settingsBtn');
  var settingsPanel = document.getElementById('settingsPanel');
  var cfgBaseUrl = document.getElementById('cfgBaseUrl');
  var cfgApiKey = document.getElementById('cfgApiKey');
  var cfgTts = document.getElementById('cfgTts');
  var cfgPerm = document.getElementById('cfgPerm');
  var cfgWorkspace = document.getElementById('cfgWorkspace');
  var saveCfg = document.getElementById('saveCfg');
  var cfgHint = document.getElementById('cfgHint');

  function openSettings() {
    settingsPanel.classList.add('show');
    cfgHint.textContent = '';
    fetch('/api/config?token=' + encodeURIComponent(token))
      .then(function (r) { return r.json(); })
      .then(function (c) {
        cfgBaseUrl.value = c.base_url || '';
        cfgApiKey.value = c.api_key || '';
        cfgTts.checked = c.tts_enable;
        cfgPerm.value = c.permission_mode || 'auto';
        cfgWorkspace.value = c.workspace || '';
      })
      .catch(function () { cfgHint.textContent = '读取配置失败'; });
  }

  settingsBtn.addEventListener('click', openSettings);
  settingsPanel.addEventListener('click', function (e) {
    if (e.target === settingsPanel) settingsPanel.classList.remove('show');
  });

  // 拉取当前配置（已保存的地址和 Key）的模型列表，同步到底部下拉框
  function reloadModels() {
    modelsPromise = null;
    return fetchModels().then(function (list) {
      if (list.length) fillModelSelect(list);
      return list;
    });
  }

  saveCfg.addEventListener('click', function () {
    cfgHint.textContent = '保存中…';
    fetch('/api/config?token=' + encodeURIComponent(token), {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        base_url: cfgBaseUrl.value,
        api_key: cfgApiKey.value,
        tts_enable: cfgTts.checked,
        permission_mode: cfgPerm.value,
        workspace: cfgWorkspace.value
      })
    })
      .then(function (r) { return r.json(); })
      .then(function (res) {
        cfgHint.textContent = res.llm_configured ? '已保存，正在拉取模型列表…' : '已保存（API Key 为空，对话暂不可用）';
        if (!res.llm_configured) {
          setTimeout(function () { settingsPanel.classList.remove('show'); }, 1200);
          return null;
        }
        return reloadModels().then(function (list) {
          cfgHint.textContent = list.length ? ('已保存并生效，共 ' + list.length + ' 个模型') : '已保存，但没拉到模型列表';
          loadToolbar();  // 刷新右上角当前模型显示
          setTimeout(function () { settingsPanel.classList.remove('show'); }, 1200);
        });
      })
      .catch(function () { cfgHint.textContent = '保存失败'; });
  });

  // ---------- 分享：多选消息 → 生成图片 ----------
  var selecting = false;
  var shareBar = document.getElementById('shareBar');
  var shareCount = document.getElementById('shareCount');
  var shareOverlay = document.getElementById('shareOverlay');
  var shareImg = document.getElementById('shareImg');
  var shareDownload = document.getElementById('shareDownload');

  function updateShareCount() {
    shareCount.textContent = messages.querySelectorAll('.msg.selected').length;
  }
  document.getElementById('btnShare').addEventListener('click', function () {
    selecting = !selecting;
    document.body.classList.toggle('selecting', selecting);
    shareBar.classList.toggle('show', selecting);
    if (!selecting) {
      messages.querySelectorAll('.msg.selected').forEach(function (el) { el.classList.remove('selected'); });
    }
    updateShareCount();
  });
  document.getElementById('shareCancel').addEventListener('click', function () {
    document.getElementById('btnShare').click();
  });
  messages.addEventListener('click', function (e) {
    if (!selecting) return;
    var el = e.target.closest('.msg');
    if (!el || el.classList.contains('system')) return;
    el.classList.toggle('selected');
    updateShareCount();
  });
  document.getElementById('shareClose').addEventListener('click', function () {
    shareOverlay.classList.remove('show');
  });

  // 把选中的消息画到 canvas（深色卡片风格）
  document.getElementById('shareGo').addEventListener('click', function () {
    var picked = Array.prototype.slice.call(messages.querySelectorAll('.msg.selected'));
    if (!picked.length) return;
    var W = 760, PAD = 28, GAP = 14, BW = W - PAD * 2;
    var canvas = document.createElement('canvas');
    var ctx = canvas.getContext('2d');
    ctx.font = '16px system-ui, sans-serif';

    // 预排版：每条消息算出行和高度
    var items = picked.map(function (el) {
      var isUser = el.classList.contains('user');
      var text = el.textContent.replace(/\d{2}:\d{2}$/, '').trim();  // 去掉末尾时间
      var words = text.split(''), lines = [], line = '';
      var maxW = BW * (isUser ? 0.75 : 0.85) - 28;
      for (var i = 0; i < words.length; i++) {
        var test = line + words[i];
        if (ctx.measureText(test).width > maxW && line) { lines.push(line); line = words[i]; }
        else line = test;
      }
      if (line) lines.push(line);
      return { user: isUser, lines: lines, h: lines.length * 24 + 22 };
    });
    var H = PAD + 56 + items.reduce(function (s, it) { return s + it.h + GAP; }, 0) + PAD;
    canvas.width = W; canvas.height = H;

    // 背景 + 标题
    ctx.fillStyle = '#0f1117';
    ctx.fillRect(0, 0, W, H);
    ctx.font = 'bold 22px system-ui, sans-serif';
    ctx.fillStyle = '#1a9fff';
    ctx.fillText('DeckMate 对话', PAD, PAD + 10);
    ctx.font = '13px system-ui, sans-serif';
    ctx.fillStyle = '#8b91a3';
    ctx.fillText(new Date().toLocaleString(), PAD, PAD + 34);

    var y = PAD + 56;
    ctx.font = '16px system-ui, sans-serif';
    items.forEach(function (it) {
      var maxLineW = 0;
      it.lines.forEach(function (l) { maxLineW = Math.max(maxLineW, ctx.measureText(l).width); });
      var bw = Math.max(maxLineW + 28, 60);
      var x = it.user ? W - PAD - bw : PAD;
      // 气泡
      ctx.fillStyle = it.user ? '#1a9fff' : '#232737';
      var r = 14;
      ctx.beginPath();
      ctx.roundRect(x, y, bw, it.h, r);
      ctx.fill();
      // 文本
      ctx.fillStyle = it.user ? '#ffffff' : '#e8eaf0';
      it.lines.forEach(function (l, i) { ctx.fillText(l, x + 14, y + 30 + i * 24); });
      y += it.h + GAP;
    });

    var url = canvas.toDataURL('image/png');
    shareImg.src = url;
    shareDownload.href = url;
    shareOverlay.classList.add('show');
    document.getElementById('btnShare').click();  // 退出选择模式
  });

  // ---------- 输入框工具栏：＋附件 / 权限 / 模型 ----------
  var plusMenu = document.getElementById('plusMenu');
  var fileList = document.getElementById('fileList');
  var imgInput = document.getElementById('imgInput');
  var permSelect = document.getElementById('permSelect');
  var modelSelect = document.getElementById('modelSelect');

  function postConfig(patch) {
    return fetch('/api/config?token=' + encodeURIComponent(token), {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(patch)
    }).catch(function () {});
  }

  function loadToolbar() {
    fetch('/api/config?token=' + encodeURIComponent(token))
      .then(function (r) { return r.json(); })
      .then(function (c) {
        if (c.permission_mode) permSelect.value = c.permission_mode;
        // 模型下拉：先用当前模型占位，再异步补上服务商真实模型列表
        fillModelSelect([c.model]);
        if (c.model) modelSelect.value = c.model;
        fetchModels().then(function (list) { fillModelSelect(list, c.model); });
      })
      .catch(function () {});
  }

  function fillModelSelect(list, current) {
    var cur = current || modelSelect.value;
    var seen = {};
    var opts = [];
    [cur].concat(list || []).forEach(function (m) {
      if (!m || seen[m]) return;
      seen[m] = 1; opts.push(m);
    });
    // 按名字首字母排序，忽略大小写
    opts.sort(function (a, b) { return a.localeCompare(b, 'en', { sensitivity: 'base' }); });
    modelSelect.innerHTML = '';
    opts.forEach(function (m) {
      var o = document.createElement('option');
      o.value = m; o.textContent = m;
      modelSelect.appendChild(o);
    });
    if (cur) modelSelect.value = cur;
  }

  // 从服务商拉当前配置的模型列表：GET /models，OpenAI 兼容接口都支持
  var modelsPromise = null;
  function fetchModels() {
    if (!modelsPromise) {
      modelsPromise = fetch('/api/models?token=' + encodeURIComponent(token))
        .then(function (r) { return r.json(); })
        .then(function (d) { return d.models || []; })
        .catch(function () { modelsPromise = null; return []; });
    }
    return modelsPromise;
  }
  permSelect.addEventListener('change', function () {
    postConfig({ permission_mode: permSelect.value });
    addSystem('权限模式已切换：' + permSelect.options[permSelect.selectedIndex].text);
  });
  modelSelect.addEventListener('change', function () {
    postConfig({ model: modelSelect.value });
    addSystem('模型已切换为 ' + modelSelect.value);
  });

  // ＋ 附件菜单
  document.getElementById('btnPlus').addEventListener('click', function (e) {
    e.stopPropagation();
    fileList.classList.remove('show');
    plusMenu.classList.toggle('show');
  });
  document.addEventListener('click', function (e) {
    if (!plusMenu.contains(e.target)) plusMenu.classList.remove('show');
    if (!fileList.contains(e.target) && e.target.id !== 'pmFile') fileList.classList.remove('show');
  });

  // 附加图片：上传后把图片标记插入输入框（发送时模型能看到图）
  document.getElementById('pmImage').addEventListener('click', function () {
    plusMenu.classList.remove('show');
    imgInput.click();
  });
  imgInput.addEventListener('change', function () {
    if (!imgInput.files.length) return;
    var fd = new FormData();
    fd.append('file', imgInput.files[0]);
    addSystem('上传图片中…');
    fetch('/api/upload?token=' + encodeURIComponent(token), { method: 'POST', body: fd })
      .then(function (r) { return r.json(); })
      .then(function (res) {
        if (res.url) {
          input.value += (input.value ? '\n' : '') + '![图片](' + res.url + ')';
          input.focus();
        } else addSystem('上传失败');
      })
      .catch(function () { addSystem('上传失败'); });
    imgInput.value = '';
  });

  // 引用工作区文件：@{路径}
  document.getElementById('pmFile').addEventListener('click', function (e) {
    e.stopPropagation();
    plusMenu.classList.remove('show');
    fetch('/api/files?token=' + encodeURIComponent(token))
      .then(function (r) { return r.json(); })
      .then(function (res) {
        fileList.innerHTML = '';
        if (!res.files.length) {
          fileList.innerHTML = '<button disabled style="color:var(--muted)">（工作区还没有文件）</button>';
        }
        res.files.forEach(function (f) {
          var b = document.createElement('button');
          b.textContent = f;
          b.addEventListener('click', function () {
            input.value += (input.value ? ' ' : '') + '@{' + f + '}';
            fileList.classList.remove('show');
            input.focus();
          });
          fileList.appendChild(b);
        });
        fileList.classList.add('show');
      })
      .catch(function () { addSystem('读取工作区失败'); });
  });

  // 引用当前屏幕截图
  document.getElementById('pmShot').addEventListener('click', function () {
    plusMenu.classList.remove('show');
    if (ws && ws.readyState === 1 && !busy) {
      ws.send(JSON.stringify({ type: 'chat', text: '截屏，把当前桌面画面展示给我' }));
      setBusy(true);
    }
  });


  loadToolbar();

  // ---------- 亮暗主题 ----------
  function applyTheme(t) {
    document.documentElement.setAttribute('data-theme', t);
    localStorage.setItem('deckmate_theme', t);
    document.getElementById('btnTheme').textContent = t === 'light' ? '深色模式' : '浅色模式';
  }
  applyTheme(localStorage.getItem('deckmate_theme') || 'dark');
  document.getElementById('btnTheme').addEventListener('click', function () {
    applyTheme(document.documentElement.getAttribute('data-theme') === 'light' ? 'dark' : 'light');
  });

  // 窄屏（手机）侧栏抽屉
  document.getElementById('btnMenu').addEventListener('click', function () {
    document.body.classList.toggle('sb-open');
  });
  messages.addEventListener('click', function () {
    document.body.classList.remove('sb-open');
  });

  // ---------- 侧栏：系统状态卡 ----------
  function fmtGB(b) { return (b / 1073741824).toFixed(1) + 'G'; }
  function fmtUptime(s) {
    var h = Math.floor(s / 3600), m = Math.floor((s % 3600) / 60);
    return h > 0 ? h + '小时' + m + '分' : m + '分钟';
  }
  function setBar(fillEl, valEl, pct, text) {
    fillEl.style.width = Math.min(pct, 100) + '%';
    fillEl.classList.toggle('hot', pct >= 85);
    valEl.textContent = text;
  }
  function pollSys() {
    if (!token) return;
    fetch('/api/sysinfo?token=' + encodeURIComponent(token))
      .then(function (r) { return r.json(); })
      .then(function (d) {
        if (d.error) return;
        document.getElementById('sysIp').textContent = d.ip || '–';
        setBar(document.getElementById('cpuFill'), document.getElementById('cpuVal'), d.cpu, Math.round(d.cpu) + '%');
        setBar(document.getElementById('memFill'), document.getElementById('memVal'), d.mem_pct,
               fmtGB(d.mem_used) + '/' + fmtGB(d.mem_total));
        setBar(document.getElementById('diskFill'), document.getElementById('diskVal'), d.disk_pct,
               Math.round(d.disk_pct) + '%');
        document.getElementById('sysSub').textContent =
          '硬盘 ' + fmtGB(d.disk_used) + '/' + fmtGB(d.disk_total) + ' · 已运行 ' + fmtUptime(d.uptime);
      })
      .catch(function () {});
  }
  pollSys();
  setInterval(pollSys, 5000);

  // ---------- 侧栏：会话列表 ----------
  var sessList = document.getElementById('sessList');
  var currentSid = null;
  function loadSessions() {
    if (!token) return;
    fetch('/api/sessions?token=' + encodeURIComponent(token))
      .then(function (r) { return r.json(); })
      .then(function (d) {
        currentSid = d.current;
        sessList.innerHTML = '';
        (d.items || []).forEach(function (s) {
          var row = document.createElement('div');
          row.className = 'sess' + (s.id === d.current ? ' current' : '');
          var title = document.createElement('span');
          title.className = 's-title';
          title.textContent = s.title || '会话';
          title.title = s.title + ' · ' + s.messages + ' 条消息';
          row.appendChild(title);
          var del = document.createElement('button');
          del.className = 's-del';
          del.textContent = '删除';
          del.title = '删除会话';
          del.addEventListener('click', function (e) {
            e.stopPropagation();
            // 二次确认：第一击变红，2.5 秒内再击才删除
            if (!del.classList.contains('confirm')) {
              del.classList.add('confirm');
              del.textContent = '确认?';
              setTimeout(function () { del.classList.remove('confirm'); del.textContent = '删除'; }, 2500);
              return;
            }
            fetch('/api/sessions/' + s.id + '?token=' + encodeURIComponent(token), { method: 'DELETE' })
              .then(function () { loadSessions(); })
              .catch(function () {});
          });
          row.appendChild(del);
          row.addEventListener('click', function () {
            if (s.id === currentSid || busy) return;
            fetch('/api/sessions/switch?token=' + encodeURIComponent(token), {
              method: 'POST',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify({ id: s.id })
            }).catch(function () { addSystem('切换会话失败'); });
            document.body.classList.remove('sb-open');
          });
          sessList.appendChild(row);
        });
      })
      .catch(function () {});
  }
  document.getElementById('btnNewSess').addEventListener('click', function () {
    fetch('/api/sessions/create?token=' + encodeURIComponent(token), { method: 'POST' })
      .catch(function () { addSystem('操作失败'); });
  });
  loadSessions();

  // ---------- 图片 / 代码块 点开展示 ----------
  var IS_NATIVE = new URLSearchParams(location.search).get('native') === '1';
  function openImage(url) {
    if (IS_NATIVE) {
      // 原生客户端：用系统默认工具打开（xdg-open → Gwenview 等）
      fetch('/api/open_file?token=' + encodeURIComponent(token), {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ path: url })
      }).catch(function () {});
    } else {
      window.open(url, '_blank');
    }
  }
  var codeView = document.getElementById('codeView');
  var codePre = document.getElementById('codePre');
  document.getElementById('cvClose').addEventListener('click', function () { codeView.classList.remove('show'); });
  codeView.addEventListener('click', function (e) { if (e.target === codeView) codeView.classList.remove('show'); });
  document.getElementById('cvCopy').addEventListener('click', function () {
    var t = codePre.textContent;
    if (navigator.clipboard) navigator.clipboard.writeText(t).catch(function () {});
  });
  // 事件委托：消息区里的图片与代码块
  messages.addEventListener('click', function (e) {
    if (selecting) return;  // 分享多选模式下不响应
    var img = e.target.closest('img.shot, img.chat-img');
    if (img) { openImage(img.src); return; }
    var pre = e.target.closest('.msg pre');
    if (pre) {
      codePre.textContent = pre.textContent;
      codeView.classList.add('show');
    }
  });

  connect();

  // ---------- / 快捷命令 ----------
  var COMMANDS = [
    { cmd: 'shot', label: '截屏并展示', run: function () { document.getElementById('pmShot').click(); } },
    { cmd: 'new', label: '新会话', run: function () { document.getElementById('btnNew').click(); } },
    { cmd: 'retry', label: '重试上一轮', run: function () { document.getElementById('btnRetry').click(); } },
    { cmd: 'weather', label: '查天气（发送询问）', run: function () { input.value = '查一下现在上海的天气'; } }
  ];
  input.addEventListener('input', function () {
    var v = input.value;
    if (!v.startsWith('/')) { fileList.classList.remove('show'); return; }
    var q = v.slice(1).toLowerCase();
    var hits = COMMANDS.filter(function (c) { return c.cmd.startsWith(q); });
    fileList.innerHTML = '';
    if (!hits.length) { fileList.classList.remove('show'); return; }
    hits.forEach(function (c) {
      var b = document.createElement('button');
      b.textContent = '/' + c.cmd + '  ' + c.label;
      b.addEventListener('click', function () {
        input.value = '';
        fileList.classList.remove('show');
        c.run();
      });
      fileList.appendChild(b);
    });
    fileList.classList.add('show');
  });

})();
</script>
</body>
</html>
