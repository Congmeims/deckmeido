# DeckMate 配置文件
# 首次启动时会自动从本模板生成 config.toml

[server]
host = "0.0.0.0"
port = 18765
# 访问令牌：留空则首次启动自动生成并写回此文件
# 局域网访问地址: http://<deck-ip>:18765/?token=<token>
token = ""

[llm]
# OpenAI 兼容接口，可切换 GPT / Claude(代理) / DeepSeek / Qwen / LM Studio 等
base_url = "https://api.openai.com/v1"
api_key = ""
model = "gpt-4o-mini"
timeout = 60

[agent]
# 保留的对话轮数上限
history_limit = 20
# agent 单轮最多连续调用工具次数
max_tool_rounds = 5

[persona]
# 人格设定：改这里就能换人格，重启生效
name = "DeckMate"
# 性格/语气描述
traits = "活泼可靠的游戏伙伴，略带俏皮，但办正事时干脆利落"
# 补充人设（口癖、背景等），可留空
extra = ""

[tts]
# 回复语音播报（调用 Deck 内置 TTS，在 Deck 扬声器上播放）
enable = true
# 引擎命令：espeak-ng / espeak / spd-say
engine = "espeak-ng"
# espeak-ng 语言：cmn=普通话，en-us=英语
voice = "cmn"
# 语速（词/分钟）
speed = 170
# 单次播报最长字符数（防止超长回复读个没完）
max_chars = 300

[security]
# AI 控制设备的权限模式：
#   manual = 所有命令都需手动审批
#   auto   = 只读命令自动执行，危险命令（删改/安装/系统级）需审批
#   full   = 完全访问，不再审批
permission_mode = "auto"
