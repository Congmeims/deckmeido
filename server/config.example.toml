# DeckMeido 配置文件
# 首次启动时会自动从本模板生成 config.toml

[server]
host = "0.0.0.0"
port = 18765
# 访问令牌：留空则首次启动自动生成（5 位数字+字母）
# 也可以在网页「设置」里随机生成或自定义，保存后立即生效
# 局域网访问地址: http://<deck-ip>:18765/?token=<token>
token = ""

[llm]
# OpenAI 兼容接口，可切换 GPT / Claude(代理) / DeepSeek / Qwen / LM Studio 等
base_url = "https://api.openai.com/v1"
api_key = ""
model = "gpt-4o-mini"
timeout = 60
# 思维链强度：low / medium / high。多数服务商不传这个字段就不返回 reasoning_content，
# 留空字符串则不发送该参数（由服务商默认决定）
reasoning_effort = "high"

[agent]
# agent 单轮最多连续调用工具次数
max_tool_rounds = 12
# 模型上下文窗口（tokens）。0 = 按模型名自动推断
context_window = 0
# 上下文占用达到该比例时自动压缩（0.95 = 95%）
compact_ratio = 0.95

[persona]
# 人格设定：改这里就能换人格，重启生效
name = "DeckMeido"
# 性格/语气描述
traits = "日系女仆式助手：礼貌周到、称用户为主人，办事干练，偶尔带点俏皮的亲近感"
# 补充人设（口癖、背景等），可留空
extra = ""

[tts]
# 回复语音播报（调用 Deck 内置 TTS，在 Deck 扬声器上播放）
enable = true
# 引擎命令：espeak-ng / espeak / spd-say
engine = "espeak-ng"
# espeak-ng 语言：cmn=普通话，en-us=英语
voice = "cmn"
# 语速（词/分钟）
speed = 170
# 单次播报最长字符数（防止超长回复读个没完）
max_chars = 300

[security]
# AI 控制设备的权限模式：
#   manual = 所有命令都需手动审批
#   auto   = 只读命令自动执行，危险命令（删改/安装/系统级）需审批
#   full   = 完全访问，不再审批
permission_mode = "auto"

[workspace]
# 编程/文件任务的默认工作区，可在设置面板修改
# 留空则使用 ~/deckmeido_workspace（自动创建，适配任意用户名）
dir = ""
