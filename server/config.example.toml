# DeckMeido 配置文件
# 首次启动时会自动从本模板生成 config.toml

[server]
host = "0.0.0.0"
port = 18765
# 访问令牌：首次启动默认 meido
# 也可以在网页「设置」里随机生成或自定义，保存后立即生效
# 局域网访问地址: http://<deck-ip>:18765/?token=<token>
token = "meido"

[llm]
# OpenAI 兼容接口，可切换 GPT / Claude(代理) / DeepSeek / Qwen / LM Studio 等
base_url = "https://api.openai.com/v1"
api_key = ""
model = "gpt-4o-mini"
timeout = 60
# 思维链强度：low / medium / high。多数服务商不传这个字段就不返回 reasoning_content，
# 留空字符串则不发送该参数（由服务商默认决定）
reasoning_effort = "high"
# 单次输出上限（tokens）。0 = 用满上下文剩余空间（跟随 context_window），
# 长答复因此不会被固定的小额度硬截断；填具体数字可自行收窄。
max_output_tokens = 0
# 撞到输出上限时自动续写几轮（0 = 不续写，直接以当前内容收尾）
max_continuations = 3

[agent]
# agent 单轮最多连续调用工具次数（0 = 不限，直到模型自己收尾）
max_tool_rounds = 0
# 模型上下文窗口（tokens）。0 = 按模型名自动推断
context_window = 0
# 上下文占用达到该比例时自动压缩（0.95 = 95%）
compact_ratio = 0.95
# 压缩后最近内容保留的比例（0.3 = 只留最近 30%，其余压成摘要）。
# 调小 = 单次压得多、压缩更少；调大 = 保留更多原文、压缩更频繁
compact_target_left = 0.3
# 「截屏询问」的提示词模板：插件按下按钮后会带上当前画面发这一段。
# 可在网页「设置 → 截屏询问」里随时修改，保存即生效。
# 游戏名由插件从 Steam 取到后自动写在前面，这里不用写。
ask_template = """
看我卡在哪一步，说说现在这个画面里我该做什么。需要的话先联网查一下这款游戏的攻略，
再总结成几条可以直接照做的步骤，200 字以内。
不要剧透：只讲眼前这一步怎么过，不要提前说后面的剧情、结局或其他关卡的解法。
"""

[power]
# 桌面模式下 DeckMeido 正在执行命令或显示操作遮罩时，阻止息屏与休眠
# （游戏模式下完全不干预，交给 Steam 自己管电源）
keep_awake = true

[persona]
# 人格设定：这些项都在网页「设置 → 女仆的人设」里改，保存即生效（不用重启），
# 正常情况下不需要动这个文件
name = "DeckMeido"
# 性格/语气描述
traits = "日系女仆式助手：礼貌周到、称用户为主人，办事干练，偶尔带点俏皮的亲近感"
# 补充人设（口癖、背景等），可留空
extra = ""

# 语气细节：拼在系统提示最后，优先级最高。旧配置没有这一段也能正常工作，
# 缺省值是「称呼主人 + 沉稳专业，不自加口癖」
[persona.style]
# 怎么称呼用户
address = "主人"
# 语气
tone = "礼貌、简洁、干练，偶尔一点俏皮，但不撒娇卖萌"
# 句尾习惯，留空 = 不加
ending = ""
# 落款，如 "——女仆长"，留空 = 不加
suffix = ""
# 禁用词句，出现即违规（包括句尾）
forbid = ["喵", "呢~", "人家"]

[tts]
# 回复语音播报（调用 Deck 内置 TTS，在 Deck 扬声器上播放）
# 默认关闭，需要时在网页设置页勾选，或把这里改成 true
enable = false
# 引擎命令：espeak-ng / espeak / spd-say
engine = "espeak-ng"
# espeak-ng 语言：cmn=普通话，en-us=英语
voice = "cmn"
# 语速（词/分钟）
speed = 170
# 单次播报最长字符数（防止超长回复读个没完）
max_chars = 300

[security]
# AI 控制设备的权限模式：
#   manual = 所有命令都需手动审批
#   auto   = 只读命令自动执行，危险命令（删改/安装/系统级）需审批
#   full   = 完全访问，不再审批
permission_mode = "auto"

[workspace]
# 编程/文件任务的默认工作区，可在设置面板修改
# 留空则使用 ~/deckmeido_workspace（自动创建，适配任意用户名）
dir = ""
