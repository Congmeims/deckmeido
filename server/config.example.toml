# DeckMate 配置文件
# 首次启动时会自动从本模板生成 config.toml

[server]
host = "0.0.0.0"
port = 18765
# 访问令牌：留空则首次启动自动生成并写回此文件
# 局域网访问地址: http://<deck-ip>:18765/?token=<token>
token = ""

[llm]
# OpenAI 兼容接口，可切换 GPT / Claude(代理) / DeepSeek / Qwen / LM Studio 等
base_url = "https://api.openai.com/v1"
api_key = ""
model = "gpt-4o-mini"
timeout = 60

[agent]
# 系统提示词
system_prompt = "你是 DeckMate，运行在 Steam Deck 上的 AI 助手。回答简洁，中文优先。"
# 保留的对话轮数上限
history_limit = 20
