<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2F7BF6"/>
      <stop offset="1" stop-color="#1349B0"/>
    </linearGradient>
    <clipPath id="clip"><rect width="512" height="512" rx="112"/></clipPath>
  </defs>
  <g clip-path="url(#clip)">
    <rect width="512" height="512" fill="url(#bg)"/>

    <!-- 顶部：女仆头饰卷纹 -->
    <g fill="none" stroke="#FFFFFF" stroke-width="9" stroke-linecap="round">
      <path d="M 256 78 q -34 -28 -10 -52 q 20 -18 30 2"/>
      <path d="M 256 78 q 34 -28 10 -52 q -20 -18 -30 2"/>
      <path d="M 256 78 q -66 -12 -96 18 q -18 24 -2 34"/>
      <path d="M 256 78 q 66 -12 96 18 q 18 24 2 34"/>
    </g>
    <circle cx="256" cy="78" r="12" fill="#FFFFFF"/>

    <!-- Steam Deck 机身：横向长条形，两侧圆形大握把 -->
    <path fill="#FFFFFF" d="
      M 78 250
      q 0 -86 78 -86
      l 20 0
      q 12 0 12 12
      l 0 152
      q 0 12 -12 12
      l -20 0
      q -78 0 -78 -86
      z
      M 434 250
      q 0 -86 -78 -86
      l -20 0
      q -12 0 -12 12
      l 0 152
      q 0 12 12 12
      l 20 0
      q 78 0 78 -86
      z
      M 188 182
      q -12 0 -12 12
      l 0 148
      q 0 12 12 12
      l 136 0
      q 12 0 12 -12
      l 0 -148
      q 0 -12 -12 -12
      z"/>

    <!-- 屏幕 -->
    <rect x="196" y="196" width="120" height="120" rx="10" fill="#1349B0"/>
    <!-- 屏幕高光 -->
    <rect x="206" y="206" width="50" height="14" rx="5" fill="#FFFFFF" opacity="0.35"/>

    <!-- 左侧握把：上方十字键 -->
    <g fill="#1349B0">
      <rect x="120" y="214" width="44" height="14" rx="6"/>
      <rect x="135" y="199" width="14" height="44" rx="6"/>
    </g>
    <!-- 左侧摇杆 -->
    <circle cx="142" cy="300" r="22" fill="#1349B0"/>
    <circle cx="142" cy="300" r="11" fill="#FFFFFF"/>
    <circle cx="142" cy="300" r="5" fill="#1349B0"/>

    <!-- 右侧握把：上方四键 -->
    <g fill="#1349B0">
      <circle cx="356" cy="210" r="9"/>
      <circle cx="376" cy="230" r="9"/>
      <circle cx="336" cy="230" r="9"/>
      <circle cx="356" cy="250" r="9"/>
    </g>
    <!-- 右侧摇杆 -->
    <circle cx="370" cy="300" r="22" fill="#1349B0"/>
    <circle cx="370" cy="300" r="11" fill="#FFFFFF"/>
    <circle cx="370" cy="300" r="5" fill="#1349B0"/>
  </g>
</svg>
