      <path d="M 256 84 q -38 -32 -10 -58 q 24 -20 34 4"/>
      <path d="M 256 84 q 38 -32 10 -58 q -24 -20 -34 4"/>
      <path d="M 256 84 q -76 -6 -102 26 q -16 26 4 34"/>
