<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="body" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#F7EDF3"/>
      <stop offset="1" stop-color="#E7D6E2"/>
    </linearGradient>
    <linearGradient id="screen" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3A3644"/>
      <stop offset="1" stop-color="#26232E"/>
    </linearGradient>
    <clipPath id="clip">
      <rect width="512" height="512" rx="112"/>
    </clipPath>
  </defs>

  <g clip-path="url(#clip)">
    <rect width="512" height="512" fill="#FBF7FA"/>

    <!-- 女仆蕾丝头饰（Steam Deck 顶部） -->
    <path fill="#FFFFFF" stroke="#DDD2DD" stroke-width="3"
          d="M 132 190 q 124 -92 248 0 q -12 28 -38 36 q -86 -56 -172 0 q -26 -8 -38 -36 z"/>
    <g fill="#FFFFFF" stroke="#DDD2DD" stroke-width="3">
      <circle cx="140" cy="204" r="13"/>
      <circle cx="186" cy="170" r="12"/>
      <circle cx="256" cy="152" r="12"/>
      <circle cx="326" cy="170" r="12"/>
      <circle cx="372" cy="204" r="13"/>
    </g>
    <!-- 头顶黑色蝴蝶结 -->
    <path fill="#1B1A20" d="M 256 216 q -58 -50 -78 -14 q -14 32 32 42 q 30 6 46 -28 z"/>
    <path fill="#1B1A20" d="M 256 216 q 58 -50 78 -14 q 14 32 -32 42 q -30 6 -46 -28 z"/>
    <path fill="#2E2D38" d="M 246 232 l -24 46 l 20 8 l 14 -42 z"/>
    <path fill="#2E2D38" d="M 266 232 l 24 46 l -20 8 l -14 -42 z"/>
    <circle cx="256" cy="220" r="16" fill="#111116"/>
    <!-- 两侧小蝴蝶结 -->
    <path fill="#1B1A20" d="M 96 222 q -38 -32 -50 -8 q -8 24 22 32 q 20 4 28 -24 z"/>
    <path fill="#1B1A20" d="M 96 222 q -30 24 -18 44 q 12 16 30 4 q 16 -12 4 -48 z"/>
    <path fill="#1B1A20" d="M 416 222 q 38 -32 50 -8 q 8 24 -22 32 q -20 4 -28 -24 z"/>
    <path fill="#1B1A20" d="M 416 222 q 30 24 18 44 q -12 16 -30 4 q -16 -12 -4 -48 z"/>

    <!-- 机身 -->
    <path fill="url(#body)" stroke="#B9A6B6" stroke-width="5"
          d="M 88 258 q 8 -28 48 -28 h 240 q 40 0 48 28 q 34 16 38 62 q 6 56 -12 82 q -16 22 -46 12 q -26 -8 -40 -32 h -232 q -14 24 -40 32 q -30 10 -46 -12 q -18 -26 -12 -82 q 4 -46 38 -62 z"/>

    <!-- 屏幕 -->
    <rect x="196" y="256" width="120" height="128" rx="8" fill="url(#screen)" stroke="#0F0F14" stroke-width="4"/>

    <!-- 左侧：十字键 + 摇杆 + 触控板 + 功能键 -->
    <path fill="#2B2A33" d="M 152 272 h 14 v 16 h 16 v 14 h -16 v 16 h -14 v -16 h -16 v -14 h 16 z"/>
    <circle cx="164" cy="336" r="17" fill="#2B2A33"/>
    <circle cx="164" cy="336" r="10" fill="#3D3C48"/>
    <rect x="132" y="352" width="42" height="30" rx="7" fill="#2B2A33"/>
    <rect x="142" y="392" width="22" height="8" rx="4" fill="#2B2A33"/>
    <rect x="142" y="406" width="22" height="8" rx="4" fill="#2B2A33"/>

    <!-- 右侧：四键 + 摇杆 + 触控板 + 功能键 -->
    <g fill="#2B2A33">
      <circle cx="330" cy="272" r="8.5"/>
      <circle cx="352" cy="294" r="8.5"/>
      <circle cx="308" cy="294" r="8.5"/>
      <circle cx="330" cy="316" r="8.5"/>
    </g>
    <circle cx="348" cy="336" r="17" fill="#2B2A33"/>
    <circle cx="348" cy="336" r="10" fill="#3D3C48"/>
    <rect x="338" y="352" width="42" height="30" rx="7" fill="#2B2A33"/>
    <rect x="348" y="392" width="22" height="8" rx="4" fill="#2B2A33"/>
    <rect x="348" y="406" width="22" height="8" rx="4" fill="#2B2A33"/>
  </g>
</svg>
