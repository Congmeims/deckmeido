<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#22305A"/>
      <stop offset="1" stop-color="#0D1424"/>
    </linearGradient>
    <linearGradient id="hair" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#A6B8E4"/>
      <stop offset="1" stop-color="#7286BE"/>
    </linearGradient>
    <clipPath id="clip">
      <rect width="512" height="512" rx="112"/>
    </clipPath>
  </defs>

  <g clip-path="url(#clip)">
    <rect width="512" height="512" fill="url(#bg)"/>
    <circle cx="256" cy="256" r="200" fill="#34497C" opacity="0.5"/>

    <!-- 后发：垂到肩的长发 -->
    <path fill="url(#hair)" d="M 256 74 q 132 0 140 142 q 6 92 -6 172 q -6 42 -44 48 q -30 4 -40 -26 q -6 -20 0 -62 h -100 q 6 42 0 62 q -10 30 -40 26 q -38 -6 -44 -48 q -12 -80 -6 -172 q 8 -142 140 -142 z"/>

