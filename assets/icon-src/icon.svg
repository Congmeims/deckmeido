    <ellipse cx="298" cy="256" rx="23" ry="28" fill="#FFFFFF"/>
    <ellipse cx="214" cy="258" rx="17" ry="23" fill="#4FD1CE"/>
    <ellipse cx="298" cy="258" rx="17" ry="23" fill="#4FD1CE"/>
    <ellipse cx="214" cy="262" rx="9" ry="13" fill="#12385C"/>
    <ellipse cx="298" cy="262" rx="9" ry="13" fill="#12385C"/>
    <circle cx="221" cy="247" r="6.5" fill="#FFFFFF"/>
    <circle cx="305" cy="247" r="6.5" fill="#FFFFFF"/>
    <circle cx="206" cy="270" r="4" fill="#FFFFFF" opacity="0.8"/>
    <circle cx="290" cy="270" r="4" fill="#FFFFFF" opacity="0.8"/>
    <path d="M 189 236 q 25 -15 50 0" stroke="#39466B" stroke-width="8" fill="none" stroke-linecap="round"/>
    <path d="M 273 236 q 25 -15 50 0" stroke="#39466B" stroke-width="8" fill="none" stroke-linecap="round"/>

    <!-- 腮红 -->
    <ellipse cx="178" cy="296" rx="19" ry="10" fill="#F8A9A9" opacity="0.5"/>
    <ellipse cx="334" cy="296" rx="19" ry="10" fill="#F8A9A9" opacity="0.5"/>

    <!-- 鼻与嘴 -->
    <path d="M 256 292 q 5 7 -3 9" stroke="#E3B69F" stroke-width="4" fill="none" stroke-linecap="round"/>
    <path d="M 241 314 q 15 13 30 0" stroke="#DB7C77" stroke-width="5" fill="none" stroke-linecap="round"/>

